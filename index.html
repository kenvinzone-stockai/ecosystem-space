    const minimapCanvas = document.getElementById('minimap');
    const mctx = minimapCanvas.getContext('2d');
    function resizeMinimap() {
        const r = minimapCanvas.getBoundingClientRect();
        minimapCanvas.width = r.width * 2;
        minimapCanvas.height = r.height * 2;
        mctx.scale(2, 2);
    }
    resizeMinimap();

    function drawMinimap() {
        const w = minimapCanvas.width / 2;
        const h = minimapCanvas.height / 2;
        mctx.clearRect(0, 0, w, h);

        const cx = w / 2, cy = h / 2;
        const scale = 1.4;

        mctx.strokeStyle = 'rgba(0, 240, 255, 0.08)';
        mctx.lineWidth = 0.5;
        for (let x = 0; x <= w; x += 14) {
            mctx.beginPath(); mctx.moveTo(x, 0); mctx.lineTo(x, h); mctx.stroke();
        }
        for (let y = 0; y <= h; y += 14) {
            mctx.beginPath(); mctx.moveTo(0, y); mctx.lineTo(w, y); mctx.stroke();
        }

        bodies.forEach(b => {
            if (b.data.type !== 'planet') return;
            mctx.strokeStyle = `rgba(${b.data.rgb}, 0.25)`;
            mctx.beginPath();
            mctx.arc(cx, cy, b.data.distance * scale, 0, Math.PI * 2);
            mctx.stroke();
        });

        bodies.forEach(b => {
            const x = cx + b.mesh.position.x * scale;
            const y = cy + b.mesh.position.z * scale;
            mctx.fillStyle = `rgb(${b.data.rgb})`;
            mctx.beginPath();
            mctx.arc(x, y, b.data.type === 'star' ? 4 : 2.5, 0, Math.PI * 2);
            mctx.fill();

            if (selectedMesh === b.mesh) {
                mctx.strokeStyle = `rgba(${b.data.rgb}, 0.8)`;
                mctx.lineWidth = 1;
                mctx.beginPath();
                mctx.arc(x, y, 7, 0, Math.PI * 2);
                mctx.stroke();
            }
        });

        const camX = cx + camera.position.x * scale;
        const camY = cy + camera.position.z * scale;
        mctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        mctx.lineWidth = 1;
        mctx.beginPath();
        mctx.moveTo(camX - 4, camY);
        mctx.lineTo(camX + 4, camY);
        mctx.moveTo(camX, camY - 4);
        mctx.lineTo(camX, camY + 4);
        mctx.stroke();
    }

    // ============================================================
    // ANIMATION LOOP
    // ============================================================
    const clock = new THREE.Clock();
    let elapsed = 0;

    function animate() {
        requestAnimationFrame(animate);
        const dt = clock.getDelta();
        elapsed += dt;

        finalPass.uniforms.uTime.value = elapsed;

        if (transitionProgress < 1) {
            transitionProgress += dt * 0.9;
            const t = Math.min(transitionProgress, 1);
            const easeT = 1 - Math.pow(1 - t, 3);
            camera.position.lerp(targetCamPos, easeT * 0.05);
            controls.target.lerp(targetCamLook, easeT * 0.08);
        }

        starLayers.forEach(layer => {
            layer.mesh.rotation.y += dt * layer.speed;
            layer.mesh.rotation.x += dt * layer.speed * 0.3;
        });

        // ===== UPDATE ALIEN SPACESHIP =====
        shipT += dt;
        const sT = (shipT % SHIP_CYCLE) / SHIP_CYCLE;
        const sPos = getShipPos(sT);
        const sPosNext = getShipPos((sT + 0.005) % 1);

        alienShip.position.copy(sPos);
        // Tàu hơi nghiêng theo hướng bay nhưng giữ đáy đĩa hướng xuống
        // (UFO không lăn 360° như tàu cyberpunk, chỉ tilt nhẹ)
        const flightDir = sPosNext.clone().sub(sPos).normalize();
        // Tilt: nghiêng đĩa hơi xuống theo hướng bay
        alienShip.rotation.z = -flightDir.x * 0.25;
        alienShip.rotation.x = flightDir.z * 0.25;
        // Saucer xoay quanh trục thẳng đứng — tạo cảm giác "đĩa quay"
        saucer.rotation.y += dt * 0.6;
        rim.rotation.z += dt * 0.4;
        haloRing.rotation.z -= dt * 0.6;

        // Đèn dưới đáy xoay tròn và pulse
        bottomLights.forEach((lt, i) => {
            lt.userData.angle += dt * 1.2;
            lt.position.x = Math.cos(lt.userData.angle) * 1.3;
            lt.position.z = Math.sin(lt.userData.angle) * 1.3;
            lt.material.opacity = 0.7 + Math.sin(elapsed * 3 + i) * 0.3;
        });

        // Dome pulse violet
        domeMat.emissiveIntensity = 0.7 + Math.sin(elapsed * 2.2) * 0.25;

        // Halo ring pulse opacity
        haloRingMat.opacity = 0.35 + Math.sin(elapsed * 1.8) * 0.2;

        // Tractor beam shimmer
        tractorBeam.material.opacity = 0.08 + Math.sin(elapsed * 4) * 0.05;

        // Point lights pulse nhẹ
        shipLight.intensity = 2 + Math.sin(elapsed * 2.5) * 0.6;
        shipDomeLight.intensity = 1.2 + Math.sin(elapsed * 1.7) * 0.4;

        // Ship trail
        shipTrailHistory.unshift(sPos.clone());
        if (shipTrailHistory.length > SHIP_TRAIL_N) shipTrailHistory.pop();
        const sTrailPosA = shipTrailGeo.attributes.position;
        const sTrailColA = shipTrailGeo.attributes.color;
        for (let i = 0; i < SHIP_TRAIL_N; i++) {
            const p = shipTrailHistory[i];
            const spread = i * 0.02;
            sTrailPosA.array[i * 3]     = p.x + (Math.random() - 0.5) * spread;
            sTrailPosA.array[i * 3 + 1] = p.y + (Math.random() - 0.5) * spread;
            sTrailPosA.array[i * 3 + 2] = p.z + (Math.random() - 0.5) * spread;
            // Gradient: violet sáng (gần) -> cyan -> mờ
            const r = i / SHIP_TRAIL_N;
            sTrailColA.array[i * 3]     = (1 - r) * 0.69 + r * 0.36;  // violet -> cyan-ish R
            sTrailColA.array[i * 3 + 1] = (1 - r) * 0.56 + r * 0.83;  // G
            sTrailColA.array[i * 3 + 2] = (1 - r) * 0.85 + r * 0.83;  // B
        }
        sTrailPosA.needsUpdate = true;
        sTrailColA.needsUpdate = true;
        shipTrailMat.opacity = Math.max(0.15, 0.7 - Math.abs(sPos.y) / 70);
        // ===== END ALIEN SPACESHIP =====

        // ===== UPDATE GIANT METEOR =====
        meteorT += dt;
        const meteorTn = (meteorT % METEOR_CYCLE) / METEOR_CYCLE;
        const meteorPosV = getMeteorPos(meteorTn);
        meteorGroup.position.copy(meteorPosV);

        // Xoay chậm 3 trục — cảm giác đồ sộ trôi nổi
        meteorMesh.rotation.x += dt * 0.07;
        meteorMesh.rotation.y += dt * 0.1;
        meteorMesh.rotation.z += dt * 0.045;

        // Aura pulse
        const mPulse = 1 + Math.sin(elapsed * 1.3) * 0.08;
        auraInner.scale.setScalar(mPulse);
        auraOuter.scale.setScalar(1 + Math.sin(elapsed * 0.7) * 0.14);

        // Halo sprite pulse opacity
        haloMat.opacity = 0.6 + Math.sin(elapsed * 1.9) * 0.18;

        // Emissive nhấp nháy nhẹ (vết nứt sáng)
        mMat.emissiveIntensity = 0.28 + Math.sin(elapsed * 3.2) * 0.1;

        // Light intensity giảm theo khoảng cách
        const mDist = meteorPosV.length();
        meteorLight.intensity = Math.max(1.5, 7 - mDist * 0.05);

        // Meteor trail
        meteorTrailHist.unshift(meteorPosV.clone());
        if (meteorTrailHist.length > M_TRAIL_N) meteorTrailHist.pop();
        const mTrailPA = mTrailGeo.attributes.position;
        const mTrailCA = mTrailGeo.attributes.color;
        for (let i = 0; i < M_TRAIL_N; i++) {
            const p = meteorTrailHist[i];
            const spread = i * 0.07 + 0.18;
            mTrailPA.array[i * 3]     = p.x + (Math.random() - 0.5) * spread;
            mTrailPA.array[i * 3 + 1] = p.y + (Math.random() - 0.5) * spread;
            mTrailPA.array[i * 3 + 2] = p.z + (Math.random() - 0.5) * spread;

            // Gradient pastel: lavender trắng (gần) -> violet -> cyan -> mờ
            const r = i / M_TRAIL_N;
            if (r < 0.15) {
                mTrailCA.array[i * 3]     = 0.95;
                mTrailCA.array[i * 3 + 1] = 0.88;
                mTrailCA.array[i * 3 + 2] = 1.0;
            } else if (r < 0.5) {
                const k = (r - 0.15) / 0.35;
                mTrailCA.array[i * 3]     = 0.69 - k * 0.3;
                mTrailCA.array[i * 3 + 1] = 0.56 + k * 0.2;
                mTrailCA.array[i * 3 + 2] = 0.85 - k * 0.05;
            } else {
                const fade = 1 - (r - 0.5) / 0.5;
                mTrailCA.array[i * 3]     = 0.36 * fade;
                mTrailCA.array[i * 3 + 1] = 0.83 * fade;
                mTrailCA.array[i * 3 + 2] = 0.83 * fade;
            }
        }
        mTrailPA.needsUpdate = true;
        mTrailCA.needsUpdate = true;
        // ===== END GIANT METEOR =====

        // ===== UPDATE ALIEN MOTHERSHIP =====
        motherT += dt;
        const motherTn = (motherT % MOTHER_CYCLE) / MOTHER_CYCLE;
        const motherPos = getMotherPos(motherTn);
        mothership.position.copy(motherPos);

        // Mothership giữ trục đứng (Y up) cố định — không lookAt vì với monolith
        // thẳng đứng, lookAt sẽ làm nó nghiêng kỳ cục. Thay vào đó, xoay nhẹ
        // theo trục Y để mặt rune luôn quay về hướng camera.
        const angleToOrigin = Math.atan2(motherPos.x, motherPos.z);
        mothership.rotation.y = angleToOrigin + Math.PI;

        // === GRAVITY RING xoay (đây là điểm nhấn O'Neill style) ===
        // Quay quanh trục thẳng đứng — đúng kiểu vòng tròn tạo trọng lực
        // Ring chính + neon trong + habitat modules xoay đồng bộ
        gravityRing.rotation.z += dt * 0.18;
        gravityRingEdgeMesh.rotation.z += dt * 0.18;
        ringInner.rotation.z += dt * 0.18;
        habitatGroup.rotation.y += dt * 0.18;

        // Inner ring pulse opacity
        ringInnerMat.opacity = 0.75 + Math.sin(elapsed * 0.9) * 0.2;

        // === ENERGY SLITS pulse — khe sáng dọc thân ===
        mothership.children.forEach(child => {
            if (child.userData.isSlit) {
                child.material.opacity = 0.6 + Math.sin(elapsed * 1.4 + child.userData.basePhase) * 0.3;
            }
        });

        // === HABITAT windows nhấp nháy ===
        habitatGroup.children.forEach(child => {
            if (child.userData.basePhase !== undefined) {
                child.material.opacity = 0.7 + Math.sin(elapsed * 1.8 + child.userData.basePhase) * 0.3;
            }
        });

        // === MONOLITH emissive nhẹ ===
        monolithMat.emissiveIntensity = 0.2 + Math.sin(elapsed * 0.5) * 0.06;
        monolithEdgeMat.opacity = 0.7 + Math.sin(elapsed * 0.7) * 0.15;

        // === TRANSMITTER (đỉnh spire) pulse ===
        const tPulse = 1 + Math.sin(elapsed * 2.0) * 0.25;
        transmitter.scale.setScalar(tPulse);
        transmitHalo.scale.setScalar(1 + Math.sin(elapsed * 1.5) * 0.35);
        transmitMat.opacity = 0.85 + Math.sin(elapsed * 2.0) * 0.12;

        // === RUNE DISKS quay ngược chiều — UV scroll qua texture wrap ===
        // Cách 1: xoay disk
        runeDisk.rotation.z += dt * 0.06;
        runeDisk2.rotation.z -= dt * 0.09;
        // Cách 2: cũng scroll UV để rune "chạy" quanh viền
        if (runeTexture.offset) {
            runeTexture.offset.x = (runeTexture.offset.x + dt * 0.04) % 1;
            runeDisk2Mat.map.offset.x = (runeDisk2Mat.map.offset.x - dt * 0.06 + 1) % 1;
        }
        // Pulse opacity rune để cảm giác "đang truyền tin"
        runeDiskMat.opacity = 0.7 + Math.sin(elapsed * 0.8) * 0.25;
        runeDisk2Mat.opacity = 0.55 + Math.sin(elapsed * 1.1) * 0.2;

        // === CORE pulse (tim đập chậm) ===
        const corePulse = 1 + Math.sin(elapsed * 0.6) * 0.2;
        motherCore.scale.setScalar(corePulse);
        coreHalo.scale.setScalar(1 + Math.sin(elapsed * 0.45) * 0.3);
        motherCore.material.opacity = 0.8 + Math.sin(elapsed * 0.6) * 0.15;

        // === ENERGY FIELDS breathe ===
        energyField.scale.setScalar(1 + Math.sin(elapsed * 0.3) * 0.05);
        energyField2.scale.setScalar(1 + Math.sin(elapsed * 0.22) * 0.08);

        // === SCAN BEAM shimmer + xoay ===
        scanMat.opacity = 0.05 + Math.sin(elapsed * 1.1) * 0.03;
        scanBeam.rotation.y += dt * 0.3;

        // === BACKGROUND HALO pulse ===
        motherHaloMat.opacity = 0.6 + Math.sin(elapsed * 0.5) * 0.13;
        const haloScale = 180 + Math.sin(elapsed * 0.4) * 12;
        motherHaloSprite.scale.set(haloScale, haloScale, 1);

        // === Top light pulse ===
        motherTopLight.intensity = 3.5 + Math.sin(elapsed * 1.5) * 1;
        // ===== END ALIEN MOTHERSHIP =====

        bodies.forEach(b => {
            b.mesh.rotation.y += dt * 0.3;

            if (b.data.type === 'planet') {
                if (hoveredMesh !== b.mesh && selectedMesh !== b.mesh) {
                    b.data.angle -= b.data.speed * dt;
                    b.mesh.position.x = Math.cos(b.data.angle) * b.data.distance;
                    b.mesh.position.z = Math.sin(b.data.angle) * b.data.distance;
                }
                if (b.trail) {
                    const positions = b.trailPositions;
                    for (let i = positions.length / 3 - 1; i > 0; i--) {
                        positions[i * 3] = positions[(i - 1) * 3];
                        positions[i * 3 + 1] = positions[(i - 1) * 3 + 1];
                        positions[i * 3 + 2] = positions[(i - 1) * 3 + 2];
                    }
                    positions[0] = b.mesh.position.x;
                    positions[1] = b.mesh.position.y;
                    positions[2] = b.mesh.position.z;
                    b.trail.geometry.attributes.position.needsUpdate = true;
                }
                if (b.mesh.userData.satRing) {
                    b.mesh.userData.satRing.rotation.z += dt * 0.5;
                }
            } else {
                if (b.mesh.userData.sunRing) {
                    b.mesh.userData.sunRing.rotation.z += dt * 0.15;
                }
                b.mesh.material.emissiveIntensity = b.mesh.userData.baseEmissive + Math.sin(elapsed * 1.5) * 0.3;
            }

            if (selectedMesh === b.mesh && activeBeam) {
                activeBeam.material.uniforms.uTime.value = elapsed;
            }

            const screenPos = b.mesh.position.clone().project(camera);
            if (screenPos.z > 1 || screenPos.z < -1) {
                b.label.style.opacity = '0';
                b.label.style.pointerEvents = 'none';
            } else {
                b.label.style.opacity = '1';
                b.label.style.pointerEvents = 'auto';
                const x = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
                // Tăng offset Y để label nằm rõ trên đầu hành tinh
                const yOffset = b.data.type === 'star' ? -110 : -70;
                const y = (-screenPos.y * 0.5 + 0.5) * window.innerHeight + yOffset;
                const scale = Math.max(0.55, Math.min(1.1, 1.15 - screenPos.z * 0.6));
                b.label.style.left = x + 'px';
                b.label.style.top = y + 'px';
                b.label.style.transform = `translate(-50%, -50%) scale(${scale})`;
                // Mark selected state
                b.label.classList.toggle('selected', selectedMesh === b.mesh);
            }
        });

        coreLight.intensity = 22 + Math.sin(elapsed * 1.5) * 5;

        controls.update();
        composer.render();
        drawMinimap();
    }

    animate();

    setTimeout(() => {
        clearInterval(loadInterval);
        loadFill.style.width = '100%';
        loadStatus.textContent = 'Observatory online';
        setTimeout(() => {
            document.getElementById('loading').classList.add('hidden');
            loadFromURL();
        }, 600);
    }, 2400);

    } // end initApp
    </script>
</body>
</html>
