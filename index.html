<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#020005">
    <title>KenvinZone v5.18 — Quantum Observatory</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --bg-void: #020005;
            --bg-deep: #050218;
            --neon-cyan: #00f0ff;
            --neon-magenta: #ff007f;
            --neon-amber: #ffaa00;
            --neon-violet: #b026ff;
            --neon-emerald: #00ffaa;
            --text-primary: #e8eaf6;
            --text-dim: #6b7299;
            --grid-line: rgba(0, 240, 255, 0.05);
            --card-glass: rgba(5, 2, 24, 0.65);
            --border-glass: rgba(0, 240, 255, 0.15);
            --active-glow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        * { 
            box-sizing: border-box; 
            user-select: none;
            -webkit-user-drag: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-void);
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            cursor: none;
        }

        #cursor-outer, #cursor-inner {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: screen;
            transition: transform 0.08s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #cursor-outer {
            width: 36px; height: 36px;
            border: 1.5px solid var(--neon-cyan);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 14px rgba(0,240,255,0.4);
        }
        #cursor-inner {
            width: 5px; height: 5px;
            background: var(--neon-magenta);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px var(--neon-magenta);
        }
        .cursor-hover #cursor-outer {
            transform: translate(-50%, -50%) scale(1.5);
            border-color: var(--neon-magenta);
            box-shadow: 0 0 24px var(--neon-magenta);
        }

        @media (hover: none) and (pointer: coarse) {
            html, body { cursor: auto; }
            #cursor-outer, #cursor-inner { display: none; }
        }

        .font-display { font-family: 'Syne', sans-serif; letter-spacing: -0.02em; }
        .font-mono-display { font-family: 'Major Mono Display', monospace; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        .grid-overlay {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 64px 64px;
            pointer-events: none;
            z-index: 2;
            mask-image: radial-gradient(circle at center, transparent 15%, black 90%);
            -webkit-mask-image: radial-gradient(circle at center, transparent 15%, black 90%);
        }

        .vfx-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 3;
        }
        .vfx-overlay::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.12) 50%),
                linear-gradient(90deg, rgba(255,0,127,0.01), rgba(0,240,255,0.01));
            background-size: 100% 4px, 100% 100%;
            opacity: 0.35;
        }
        .vfx-overlay::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.7) 100%);
        }

        #loading {
            position: fixed;
            inset: 0;
            background: var(--bg-void);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
        }
        #loading.hidden {
            opacity: 0;
            visibility: hidden;
        }
        .loading-logo {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: clamp(2.5rem, 8vw, 5rem);
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta) 60%, var(--neon-amber));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.04em;
            margin-bottom: 0.5rem;
            position: relative;
        }
        .loading-logo::after {
            content: 'v5.18';
            position: absolute;
            top: 0.4em;
            right: -2.4em;
            font-size: 0.22em;
            font-family: 'JetBrains Mono', monospace;
            background: var(--neon-magenta);
            color: white;
            padding: 2px 8px;
            font-weight: 500;
            letter-spacing: 0;
            border-radius: 2px;
        }
        .loading-subtitle {
            font-family: 'Major Mono Display', monospace;
            font-size: 0.75rem;
            color: var(--neon-cyan);
            letter-spacing: 0.5em;
            text-transform: uppercase;
            margin-bottom: 3rem;
            opacity: 0.75;
        }
        .loading-progress-bar {
            width: min(340px, 75vw);
            height: 3px;
            background: rgba(255,255,255,0.06);
            position: relative;
            border-radius: 1px;
            overflow: hidden;
        }
        .loading-progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
            box-shadow: 0 0 14px var(--neon-cyan);
            transition: width 0.25s ease;
        }
        .loading-status {
            margin-top: 1.25rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            color: var(--text-dim);
            letter-spacing: 0.1em;
            height: 1.2rem;
        }
        .loading-status::before {
            content: '> ';
            color: var(--neon-magenta);
        }
        .loading-error {
            margin-top: 1.5rem;
            padding: 0.75rem 1.25rem;
            border: 1px solid var(--neon-magenta);
            background: rgba(255, 0, 127, 0.08);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            color: var(--neon-magenta);
            max-width: 400px;
            text-align: center;
            display: none;
            border-radius: 4px;
        }
        .loading-error.show { display: block; }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 1.5rem 2rem;
            pointer-events: none;
        }
        .top-bar > * { pointer-events: auto; }

        .brand-block { display: flex; flex-direction: column; }
        .brand-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--neon-cyan);
            letter-spacing: 0.3em;
            opacity: 0.75;
            margin-bottom: 0.35rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .brand-tag::before {
            content: '';
            width: 7px; height: 7px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-cyan);
            animation: pulse-dot 2s infinite ease-in-out;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }
        .brand-name {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: clamp(1.5rem, 3vw, 2.25rem);
            letter-spacing: -0.04em;
            line-height: 1;
            background: linear-gradient(120deg, var(--neon-cyan) 0%, #ffffff 40%, var(--neon-magenta) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .brand-version {
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.55rem;
            background: var(--neon-magenta);
            color: white;
            padding: 1.5px 7px;
            margin-left: 0.6rem;
            vertical-align: middle;
            letter-spacing: 0.1em;
            border-radius: 2px;
        }

        .status-block {
            text-align: right;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            background: rgba(5,2,24,0.4);
            padding: 0.75rem 1rem;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.03);
            backdrop-filter: blur(10px);
        }
        .status-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.25rem;
            color: var(--text-dim);
        }
        .status-row:last-child { margin-bottom: 0; }
        .status-row strong {
            color: var(--text-primary);
            font-weight: 500;
        }
        .status-row .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot-green { background: var(--neon-emerald); box-shadow: 0 0 6px var(--neon-emerald); }
        .dot-amber { background: var(--neon-amber); box-shadow: 0 0 6px var(--neon-amber); }
        .dot-cyan  { background: var(--neon-cyan);    box-shadow: 0 0 6px var(--neon-cyan); }

        .side-nav {
            position: fixed;
            left: 2rem;
            top: 50%;
            transform: translateY(-50%);
            z-index: 15;
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            pointer-events: auto;
        }
        .nav-node {
            position: relative;
            display: flex;
            align-items: center;
            gap: 1.25rem;
            padding: 0;
            cursor: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .nav-node-dot {
            width: 12px; height: 12px;
            background: transparent;
            border: 1.5px solid var(--node-color, var(--text-dim));
            border-radius: 50%;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }
        .nav-node-line {
            width: 20px;
            height: 1px;
            background: var(--node-color, var(--text-dim));
            opacity: 0.35;
            transition: all 0.3s ease;
        }
        .nav-node-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-dim);
            opacity: 0;
            transform: translateX(-12px);
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        .nav-node:hover .nav-node-dot {
            background: var(--node-color);
            box-shadow: 0 0 16px var(--node-color);
            transform: scale(1.3);
        }
        .nav-node:hover .nav-node-line {
            width: 36px;
            opacity: 1;
        }
        .nav-node:hover .nav-node-label {
            opacity: 1;
            transform: translateX(0);
            color: var(--node-color);
        }
        .nav-node.active .nav-node-dot {
            background: var(--node-color);
            box-shadow: 0 0 16px var(--node-color);
        }
        .nav-node.active .nav-node-label {
            opacity: 1;
            transform: translateX(0);
            color: var(--node-color);
        }

        /* High-Tech Terminal Container */
        .ai-terminal {
            position: fixed;
            right: 2rem;
            top: 50%;
            transform: translateY(-50%);
            z-index: 15;
            width: 420px;
            max-height: 72vh;
            display: flex;
            flex-direction: column;
            background: var(--card-glass);
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .ai-terminal::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-magenta), transparent);
        }
        .ai-terminal::after {
            content: '';
            position: absolute;
            top: -1px; right: -1px;
            width: 28px; height: 28px;
            border-top: 1.5px solid var(--neon-cyan);
            border-right: 1.5px solid var(--neon-cyan);
            pointer-events: none;
        }

        @media (min-width: 901px) {
            .ai-terminal {
                transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1), 
                            max-height 0.6s cubic-bezier(0.16, 1, 0.3, 1), 
                            background 0.4s ease, 
                            border-color 0.4s ease,
                            box-shadow 0.4s ease;
            }
            .ai-terminal.collapsed {
                width: 60px;
                max-height: 72vh; 
                background: rgba(4, 2, 20, 0.85);
                border-left: 2px solid var(--neon-magenta);
                box-shadow: -5px 0 25px rgba(255, 0, 127, 0.25);
                cursor: pointer;
            }
            .ai-terminal.collapsed .chat-box,
            .ai-terminal.collapsed .quick-actions,
            .ai-terminal.collapsed .input-area {
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.3s ease;
            }
            .ai-terminal .chat-box,
            .ai-terminal .quick-actions,
            .ai-terminal .input-area {
                transition: opacity 0.4s ease 0.1s;
            }
            .ai-terminal.collapsed .terminal-header {
                border-bottom: none;
                background: transparent;
                height: 100%;
                width: 100%;
                flex-direction: column;
                justify-content: flex-start;
                align-items: center;
                padding: 1.5rem 0;
                gap: 2.5rem;
            }
            .ai-terminal.collapsed .terminal-title {
                font-size: 0;
                color: transparent;
                flex-direction: column;
                align-items: center;
                gap: 0;
            }
            .ai-terminal.collapsed .terminal-title-dot {
                width: 10px;
                height: 10px;
            }
            .ai-terminal.collapsed .terminal-action {
                writing-mode: vertical-lr;
                text-orientation: mixed;
                padding: 0.8rem 0.4rem;
                font-size: 0.62rem;
                border: 1px solid rgba(255, 0, 127, 0.4);
                color: var(--neon-magenta);
                box-shadow: 0 0 10px rgba(255, 0, 127, 0.15);
                white-space: nowrap;
                margin-top: 1rem;
            }
        }

        .terminal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.25rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(0, 0, 0, 0.4);
            cursor: none;
            flex-shrink: 0;
        }
        .terminal-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-family: 'Major Mono Display', monospace;
            font-size: 0.78rem;
            color: var(--neon-magenta);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }
        .terminal-title-dot {
            position: relative;
            width: 8px; height: 8px;
        }
        .terminal-title-dot::before, .terminal-title-dot::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: var(--neon-magenta);
        }
        .terminal-title-dot::after {
            animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
        }
        @keyframes ping {
            75%, 100% { transform: scale(2.8); opacity: 0; }
        }
        .terminal-action {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--neon-cyan);
            background: transparent;
            border: 1px solid rgba(0, 240, 255, 0.25);
            padding: 0.35rem 0.7rem;
            letter-spacing: 0.1em;
            transition: all 0.25s ease;
            cursor: none;
            border-radius: 2px;
        }
        .terminal-action:hover {
            background: var(--neon-cyan);
            color: var(--bg-void);
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .chat-box::-webkit-scrollbar { width: 3px; }
        .chat-box::-webkit-scrollbar-track { background: transparent; }
        .chat-box::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--neon-cyan), var(--neon-magenta));
        }

        .msg {
            display: flex;
            gap: 0.85rem;
            animation: msg-in 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes msg-in {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-avatar {
            width: 32px; height: 32px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Major Mono Display', monospace;
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            border-radius: 4px;
        }
        .msg.ai .msg-avatar {
            background: rgba(255, 0, 127, 0.1);
            border: 1px solid var(--neon-magenta);
            color: var(--neon-magenta);
            box-shadow: 0 0 8px rgba(255,0,127,0.2);
        }
        .msg.user .msg-avatar {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: 0 0 8px rgba(0,240,255,0.2);
        }
        .msg-body {
            flex: 1;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            line-height: 1.65;
        }
        .msg.ai .msg-body { color: #e8eaf6; }
        .msg.user .msg-body {
            color: var(--neon-cyan);
            opacity: 0.9;
            font-size: 0.75rem;
            padding-top: 0.35rem;
        }
        .msg-body p { margin: 0 0 0.65rem 0; }
        .msg-body p:last-child { margin-bottom: 0; }
        .msg-body strong {
            color: var(--neon-amber);
            font-weight: 600;
        }
        .msg-body em {
            color: var(--neon-magenta);
            font-style: normal;
        }
        .msg-body code {
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.15);
            padding: 2px 6px;
            color: var(--neon-cyan);
            font-size: 0.85em;
            border-radius: 3px;
        }
        .msg-body ul, .msg-body ol {
            padding-left: 1.25rem;
            margin: 0.5rem 0;
        }
        .msg-body li { margin-bottom: 0.35rem; }
        .msg-body a {
            color: var(--neon-cyan);
            text-decoration: none;
            border-bottom: 1px dashed var(--neon-cyan);
        }

        .typing-cursor {
            display: inline-block;
            width: 8px;
            height: 1.1em;
            background: var(--neon-magenta);
            vertical-align: text-bottom;
            margin-left: 3px;
            animation: blink 1s steps(2) infinite;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            50.01%, 100% { opacity: 0; }
        }

        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.45rem;
            padding: 1rem 1.25rem;
            border-top: 1px solid rgba(255,255,255,0.03);
            background: rgba(0,0,0,0.15);
            flex-shrink: 0;
        }
        .quick-btn {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.62rem;
            background: transparent;
            border: 1px solid var(--btn-color, var(--neon-cyan));
            color: var(--btn-color, var(--neon-cyan));
            padding: 0.4rem 0.8rem;
            letter-spacing: 0.05em;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: none;
            opacity: 0.75;
            border-radius: 3px;
        }
        .quick-btn:hover {
            background: var(--btn-color);
            color: var(--bg-void);
            opacity: 1;
            box-shadow: 0 0 16px var(--btn-color);
        }

        .input-area {
            display: flex;
            gap: 0.6rem;
            padding: 1rem 1.25rem;
            border-top: 1px solid rgba(255,255,255,0.04);
            background: rgba(0,0,0,0.25);
            flex-shrink: 0;
        }
        .input-area input {
            flex: 1;
            background: rgba(0,0,0,0.45);
            border: 1px solid rgba(0,240,255,0.15);
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            padding: 0.65rem 0.85rem;
            outline: none;
            cursor: none;
            border-radius: 3px;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }
        .input-area input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
        }
        .input-area input::placeholder { color: var(--text-dim); }
        .send-btn {
            background: transparent;
            border: 1px solid var(--neon-magenta);
            color: var(--neon-magenta);
            padding: 0 1.2rem;
            font-family: 'Major Mono Display', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            cursor: none;
            border-radius: 3px;
            transition: all 0.25s ease;
        }
        .send-btn:hover {
            background: var(--neon-magenta);
            color: white;
            box-shadow: 0 0 20px var(--neon-magenta);
        }

        .planet-hud {
            position: fixed;
            bottom: 2.5rem;
            left: 50%;
            transform: translate(-50%, 50px);
            z-index: 18;
            opacity: 0;
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: stretch;
            background: rgba(5, 2, 24, 0.8);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 8px;
            max-width: 90vw;
            min-width: 520px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            overflow: hidden;
        }
        .planet-hud.visible {
            opacity: 1;
            transform: translate(-50%, 0);
            pointer-events: auto;
        }
        .planet-hud::before {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--hud-color, var(--neon-magenta)), transparent);
        }

        .planet-hud-emoji {
            width: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            border-right: 1px solid rgba(255,255,255,0.06);
            background: rgba(0,0,0,0.25);
            position: relative;
        }
        .planet-hud-emoji::after {
            content: '';
            position: absolute;
            top: 8px; left: 8px;
            width: 14px; height: 14px;
            border-top: 1.5px solid var(--hud-color);
            border-left: 1.5px solid var(--hud-color);
        }
        .planet-hud-info {
            padding: 1.25rem 1.75rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 240px;
        }
        .planet-hud-id {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--text-dim);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 0.35rem;
        }
        .planet-hud-name {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 1.65rem;
            color: var(--hud-color, white);
            line-height: 1;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }
        .planet-hud-desc {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            color: var(--text-dim);
            line-height: 1.6;
            max-width: 320px;
        }
        .planet-hud-actions {
            display: flex;
            border-left: 1px solid rgba(255,255,255,0.06);
        }
        .hud-btn {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0 1.75rem;
            background: transparent;
            border: none;
            border-right: 1px solid rgba(255,255,255,0.06);
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: none;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .hud-btn:last-child { border-right: none; }
        .hud-btn:hover {
            background: var(--hud-color);
            color: var(--bg-void);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
        }
        .hud-btn.primary { color: var(--neon-cyan); }
        .hud-btn.primary:hover {
            background: var(--neon-cyan);
            color: var(--bg-void);
        }

        .minimap {
            position: fixed;
            bottom: 2.5rem;
            left: 2.5rem;
            z-index: 15;
            width: 140px;
            height: 140px;
            background: rgba(5, 2, 24, 0.7);
            border: 1px solid var(--border-glass);
            border-radius: 4px;
            backdrop-filter: blur(12px);
            pointer-events: none;
        }
        .minimap-label {
            position: absolute;
            top: -22px;
            left: 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.55rem;
            color: var(--neon-cyan);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            opacity: 0.8;
        }
        .minimap-canvas { width: 100%; height: 100%; }

        .console-log {
            position: fixed;
            bottom: 2.5rem;
            right: 2.5rem;
            z-index: 15;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            color: var(--text-dim);
            line-height: 1.6;
            max-width: 320px;
            text-align: right;
            pointer-events: none;
            opacity: 0.75;
        }
        .console-log div { margin-bottom: 2px; }
        .console-log .log-cyan { color: var(--neon-cyan); }
        .console-log .log-magenta { color: var(--neon-magenta); }
        .console-log .log-amber { color: var(--neon-amber); }

        .planet-label {
            position: absolute;
            transform: translate(-50%, -50%);
            pointer-events: auto;
            cursor: none;
            transition: opacity 0.3s ease;
        }
        .label-inner {
            position: relative;
            padding: 0.45rem 0.9rem 0.5rem 0.9rem;
            background: rgba(5, 2, 24, 0.75);
            border: 1px solid var(--label-color, var(--neon-cyan));
            font-family: 'JetBrains Mono', monospace;
            white-space: nowrap;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 0 16px rgba(var(--label-rgb, 0, 240, 255), 0.3),
                        inset 0 0 12px rgba(var(--label-rgb, 0, 240, 255), 0.08);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            border-radius: 3px;
        }
        .label-code {
            font-size: 0.58rem;
            color: var(--label-color);
            opacity: 0.85;
            letter-spacing: 0.25em;
            text-transform: uppercase;
        }
        .label-name {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 0.88rem;
            color: #fff;
            letter-spacing: 0.05em;
            text-shadow: 0 0 8px var(--label-color);
            line-height: 1;
        }
        .label-inner::before {
            content: '';
            position: absolute;
            top: -4px; left: -4px;
            width: 8px; height: 8px;
            border-top: 1.5px solid var(--label-color);
            border-left: 1.5px solid var(--label-color);
        }
        .label-inner::after {
            content: '';
            position: absolute;
            bottom: -4px; right: -4px;
            width: 8px; height: 8px;
            border-bottom: 1.5px solid var(--label-color);
            border-right: 1.5px solid var(--label-color);
        }
        .planet-label:hover .label-inner {
            background: var(--label-color);
            box-shadow: 0 0 32px var(--label-color);
            transform: scale(1.1);
        }
        .planet-label:hover .label-name { color: var(--bg-void); text-shadow: none; }
        .planet-label:hover .label-code { color: var(--bg-void); opacity: 0.9; }
        .planet-label .label-connector {
            position: absolute;
            top: 100%;
            left: 50%;
            width: 1px;
            height: 38px;
            background: linear-gradient(180deg, var(--label-color), transparent);
            transform: translateX(-50%);
            opacity: 0.7;
        }
        .planet-label .label-connector::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translate(-50%, 50%);
            width: 6px;
            height: 6px;
            border: 1px solid var(--label-color);
            background: var(--bg-void);
            border-radius: 50%;
        }
        .planet-label.star-label .label-inner {
            border-color: var(--neon-amber);
            box-shadow: 0 0 24px rgba(255, 170, 0, 0.5),
                        inset 0 0 14px rgba(255, 170, 0, 0.1);
        }
        .planet-label.star-label .label-code,
        .planet-label.star-label .label-inner::before,
        .planet-label.star-label .label-inner::after {
            color: var(--neon-amber);
            border-color: var(--neon-amber);
        }
        .planet-label.star-label .label-name {
            text-shadow: 0 0 10px var(--neon-amber);
        }
        .planet-label.selected .label-inner {
            background: var(--label-color);
            box-shadow: 0 0 40px var(--label-color);
        }
        .planet-label.selected .label-name { color: var(--bg-void); text-shadow: none; }
        .planet-label.selected .label-code { color: var(--bg-void); opacity: 0.9; }

        .sound-toggle {
            position: fixed;
            bottom: calc(2.5rem + 160px);
            left: 2.5rem;
            z-index: 14;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(5, 2, 24, 0.75);
            border: 1px solid rgba(0, 240, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--neon-cyan);
            backdrop-filter: blur(12px);
            cursor: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .sound-toggle:hover {
            border-color: var(--neon-cyan);
            box-shadow: var(--active-glow);
            transform: scale(1.08);
        }
        .sound-toggle.muted { color: var(--text-dim); border-color: var(--text-dim); }
        .sound-toggle.muted:hover { box-shadow: none; }

        .ship-toggle {
            position: fixed;
            bottom: calc(2.5rem + 160px);
            left: calc(2.5rem + 56px);
            z-index: 14;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(5, 2, 24, 0.75);
            border: 1px solid rgba(0, 240, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--neon-cyan);
            backdrop-filter: blur(12px);
            cursor: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .ship-toggle:hover {
            border-color: var(--neon-cyan);
            box-shadow: var(--active-glow);
            transform: scale(1.08);
        }
        .ship-toggle.hidden-ship { color: var(--text-dim); border-color: var(--text-dim); }
        .ship-toggle.hidden-ship:hover { box-shadow: none; }

        .curved-text-overlay {
            position: fixed;
            pointer-events: none;
            z-index: 12;
            opacity: 0;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .curved-text-overlay.visible {
            opacity: 1;
        }
        .curved-text-overlay svg {
            overflow: visible;
            display: block;
        }
        .curved-text-overlay .arc-text {
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.08em;
            fill: var(--arc-color, #5dd5d5);
            filter: drop-shadow(0 0 4px var(--arc-color, #5dd5d5));
        }
        .curved-text-overlay .arc-text-small {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            font-weight: 400;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            fill: var(--arc-color, #5dd5d5);
            opacity: 0.65;
        }
        .curved-text-overlay .arc-marker {
            stroke: var(--arc-color, #5dd5d5);
            stroke-width: 1.5;
            fill: none;
            opacity: 0.7;
            stroke-dasharray: 4 6;
        }
        .curved-text-overlay .arc-tick {
            stroke: var(--arc-color, #5dd5d5);
            stroke-width: 1.5;
        }
        .curved-text-overlay .arc-dot {
            fill: var(--arc-color, #5dd5d5);
            filter: drop-shadow(0 0 4px var(--arc-color, #5dd5d5));
        }

        @media (max-width: 900px) {
            .top-bar { padding: 1rem; flex-direction: column; gap: 0.75rem; align-items: stretch; }
            .brand-block { align-items: center; }
            .status-block { display: none; }
            .side-nav { left: 0.75rem; gap: 0.65rem; }
            
            .ai-terminal {
                width: calc(100% - 1.5rem);
                right: 0.75rem;
                top: auto;
                bottom: 0.75rem;
                transform: none;
                max-height: 40vh;
                height: 40vh;
                transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            }
            .ai-terminal.collapsed { 
                max-height: 50px; 
                height: 50px;
            }

            /* Tối ưu hóa Quick Actions trên Mobile dạng thanh cuộn ngang cực kỳ sịn sò */
            .quick-actions {
                flex-wrap: nowrap;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                padding: 0.6rem 0.8rem;
                gap: 0.4rem;
            }
            .quick-actions::-webkit-scrollbar {
                display: none; /* Ẩn thanh cuộn để giữ giao diện tối giản sạch sẽ */
            }
            .quick-btn {
                flex-shrink: 0;
            }

            .minimap, .console-log { display: none; }

            .sound-toggle {
                bottom: 8.5rem;
                left: 0.75rem;
                width: 40px; height: 40px;
            }
            .ship-toggle {
                bottom: calc(8.5rem + 46px);
                left: 0.75rem;
                width: 40px; height: 40px;
            }

            /* Định vị động của Planet HUD bám sát theo trạng thái đóng/mở của Terminal */
            .planet-hud {
                bottom: 5.5rem; /* Vị trí mặc định khi Terminal đang thu nhỏ */
                left: 0.75rem;
                right: 0.75rem;
                width: auto;
                min-width: 0;
                transform: translateY(20px);
                flex-direction: row;
                border-radius: 6px;
                transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            }
            .planet-hud.visible {
                transform: translateY(0);
            }

            /* Khi Terminal mở rộng trên Mobile, đẩy Planet HUD lên trên tầm che khuất */
            .ai-terminal:not(.collapsed) ~ .planet-hud {
                bottom: calc(40vh + 1.5rem);
            }

            .planet-hud-emoji {
                width: 52px;
                height: auto;
                min-width: 52px;
                font-size: 1.6rem;
                border-right: 1px solid rgba(255,255,255,0.06);
                border-bottom: none;
                padding: 0.5rem;
            }
            .planet-hud-emoji::after {
                top: 6px; left: 6px;
                width: 10px; height: 10px;
            }
            .planet-hud-info {
                padding: 0.55rem 0.8rem;
                min-width: 0;
                flex: 1;
                overflow: hidden;
                align-items: flex-start;
                text-align: left;
            }
            .planet-hud-id {
                font-size: 0.5rem;
                letter-spacing: 0.2em;
                margin-bottom: 0.15rem;
            }
            .planet-hud-name {
                font-size: 1rem;
                line-height: 1.1;
                margin-bottom: 0.2rem;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .planet-hud-desc {
                font-size: 0.62rem;
                line-height: 1.35;
                max-width: none;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }
            .planet-hud-actions {
                border-left: 1px solid rgba(255,255,255,0.06);
                border-top: none;
                flex-direction: column;
                flex-shrink: 0;
            }
            .hud-btn {
                flex: 1;
                justify-content: center;
                padding: 0.5rem 0.7rem;
                font-size: 0.55rem;
                letter-spacing: 0.08em;
                gap: 0.3rem;
                min-width: 0;
                border-right: none;
                border-bottom: 1px solid rgba(255,255,255,0.06);
            }
            .hud-btn:last-child { border-bottom: none; }
            .hud-btn i { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <div id="cursor-outer"></div>
    <div id="cursor-inner"></div>

    <div id="loading">
        <div class="loading-logo">KenvinZone</div>
        <div class="loading-subtitle">Quantum Observatory</div>
        <div class="loading-progress-bar">
            <div class="loading-progress-fill" id="loading-fill"></div>
        </div>
        <div class="loading-status" id="loading-status">Initializing quantum core</div>
        <div class="loading-error" id="loading-error"></div>
    </div>

    <div id="canvas-container"></div>
    <div class="grid-overlay"></div>
    <div class="vfx-overlay"></div>

    <div class="top-bar">
        <div class="brand-block">
            <div class="brand-tag">KV-CORE / OBSERVATORY ONLINE</div>
            <div>
                <span class="brand-name">KenvinZone</span><span class="brand-version">v5.18</span>
            </div>
        </div>
        <div class="status-block">
            <div class="status-row"><span class="dot dot-green"></span><span>Quantum Link</span><strong>STABLE</strong></div>
            <div class="status-row"><span class="dot dot-cyan"></span><span>Nodes</span><strong>8/8 ACTIVE</strong></div>
            <div class="status-row"><span class="dot dot-amber"></span><span>Neural AI</span><strong id="status-ai">STANDBY</strong></div>
        </div>
    </div>

    <nav class="side-nav" id="side-nav"></nav>

    <div class="ai-terminal" id="ai-terminal">
        <div class="terminal-header">
            <div class="terminal-title">
                <span class="terminal-title-dot"></span>
                KV-Core Neural AI
            </div>
            <button class="terminal-action" id="terminal-toggle">— MINIMIZE</button>
        </div>
        <div class="chat-box" id="chat-box"></div>
        <div class="quick-actions">
            <button class="quick-btn" style="--btn-color: var(--neon-cyan);" data-prompt="Phân tích Vệ tinh VN-Index và lợi ích cho nhà đầu tư">📈 VN-Index</button>
            <button class="quick-btn" style="--btn-color: var(--neon-magenta);" data-prompt="Giới thiệu về AI Class: bạn dạy gì ở đây?">🎓 AI Class</button>
            <button class="quick-btn" style="--btn-color: var(--neon-amber);" data-prompt="Trading Tool có những chức năng tối ưu nào?">🛠 Trading</button>
            <button class="quick-btn" style="--btn-color: var(--neon-amber);" data-prompt="Gold &amp; Nasdaq cập nhật thị trường thế nào?">🟡 Gold</button>
            <button class="quick-btn" style="--btn-color: var(--neon-violet);" data-prompt="AI News cập nhật xu hướng công nghệ ra sao?">📰 News</button>
            <button class="quick-btn" style="--btn-color: #ff7300;" data-prompt="Crypto Index cung cấp chỉ số và dữ liệu biến động chuỗi khối như thế nào?">🪙 Crypto</button>
            <button class="quick-btn" style="--btn-color: var(--neon-emerald);" data-prompt="Forex Index phân tích tỷ giá ngoại hối toàn cầu và cập nhật biến động tiền tệ thế nào?">💱 Forex</button>
        </div>
        <div class="input-area">
            <input type="text" id="ai-input" placeholder="Truy vấn KV-Core...">
            <button class="send-btn" id="send-btn">SEND</button>
        </div>
    </div>

    <div class="planet-hud" id="planet-hud">
        <div class="planet-hud-emoji" id="hud-emoji">🌟</div>
        <div class="planet-hud-info">
            <div class="planet-hud-id" id="hud-id">NODE / 0x00</div>
            <div class="planet-hud-name" id="hud-name">—</div>
            <div class="planet-hud-desc" id="hud-desc">—</div>
        </div>
        <div class="planet-hud-actions">
            <button class="hud-btn" id="hud-ask"><i class="fa-solid fa-brain"></i> AI REPORT</button>
            <button class="hud-btn primary" id="hud-launch"><i class="fa-solid fa-arrow-up-right-from-square"></i> LAUNCH</button>
        </div>
    </div>

    <div class="minimap">
        <div class="minimap-label">SECTOR MAP</div>
        <canvas class="minimap-canvas" id="minimap"></canvas>
    </div>

    <div class="console-log" id="console-log"></div>

    <button class="sound-toggle muted" id="sound-toggle">
        <i class="fa-solid fa-volume-xmark" id="sound-icon"></i>
    </button>

    <button class="ship-toggle" id="ship-toggle" title="Ẩn/hiện tàu vũ trụ">
        <i class="fa-solid fa-rocket"></i>
    </button>

    <div class="curved-text-overlay" id="curved-text">
        <svg id="curved-svg" width="600" height="400" viewBox="-300 -200 600 400">
            <defs>
                <path id="arc-path-top" d="" />
                <path id="arc-path-bottom" d="" />
            </defs>
            <path id="arc-outer" class="arc-marker" d="" />
            <g id="arc-ticks"></g>
            <circle id="arc-dot-left" class="arc-dot" r="2.5" cx="0" cy="0" />
            <circle id="arc-dot-right" class="arc-dot" r="2.5" cx="0" cy="0" />
            <text class="arc-text">
                <textPath id="arc-textpath-main" href="#arc-path-top" startOffset="50%" text-anchor="middle">
                    PLANET NAME
                </textPath>
            </text>
            <text class="arc-text-small">
                <textPath id="arc-textpath-code" href="#arc-path-bottom" startOffset="50%" text-anchor="middle">
                    NODE / 0X00
                </textPath>
            </text>
        </svg>
    </div>

    <!-- Three.js UMD bundles -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.135.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.135.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.135.0/examples/js/postprocessing/Pass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.135.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.135.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.135.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.135.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.135.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.135.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <script>
    function checkLibrariesReady() {
        if (typeof THREE === 'undefined') return 'Three.js core';
        if (typeof THREE.OrbitControls === 'undefined') return 'OrbitControls';
        if (typeof THREE.EffectComposer === 'undefined') return 'EffectComposer';
        if (typeof THREE.RenderPass === 'undefined') return 'RenderPass';

                uniform vec3 uColor;
                uniform float uIntensity;
                uniform float uTime;
                varying vec3 vNormal;
                varying vec3 vViewDir;
                void main() {
                    float fresnel = 1.0 - dot(vNormal, vViewDir);
                    fresnel = pow(fresnel, 3.2);
                    
                    // Nhịp thở được làm chậm lại để tạo cảm giác trôi dạt hữu cơ, sang trọng

            side: THREE.BackSide,
            blending: THREE.AdditiveBlending,
            transparent: true,
            depthWrite: false

              vec3 x3 = x0 - D.yyy;
              i = mod(i, 289.0);
              vec4 p = permute(permute(permute(
                         i.z + vec4(0.0, i1.z, i2.z, 1.0))
                       + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                       + i.x + vec4(0.0, i1.x, i2.x, 1.0));
              float n_ = 0.142857142857;
              vec3 ns = n_ * D.wyz - D.xzx;
              vec4 j = p - 49.0 * floor(p * ns.z *ns.z);
              vec4 x_ = floor(j * ns.z);
              vec4 y_ = floor(j - 7.0 * x_);
              vec4 x = x_ *ns.x + ns.yyyy;
              vec4 y = y_ *ns.x + ns.yyyy;
              vec4 h = 1.0 - abs(x) - abs(y);
              vec4 b0 = vec4(x.xy, y.xy);
              vec4 b1 = vec4(x.zw, y.zw);
              vec4 s0 = floor(b0)*2.0 + 1.0;
              vec4 s1 = floor(b1)*2.0 + 1.0;
              vec4 sh = -step(h, vec4(0.0));
              vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
              vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
              vec3 p0 = vec3(a0.xy, h.x);
              vec3 p1 = vec3(a0.zw, h.y);
              vec3 p2 = vec3(a1.xy, h.z);
              vec3 p3 = vec3(a1.zw, h.w);
              vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
              p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
              vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
              m = m * m;
              return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
            }
        `;

        const mat = new THREE.ShaderMaterial({
            uniforms: {
                uColor: { value: color },
                uIntensity: { value: isStar ? 0.6 : 0.8 },
                uTime: { value: 0 },
                uDistortion: { value: distortionStrength }
            },
            vertexShader: `
                varying vec3 vNormal;
                varying vec3 vViewDir;
                varying vec3 vWorldPosition;
                uniform float uTime;
                uniform float uDistortion;
                ${simplexNoiseGLSL}
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
                    vViewDir = normalize(-mvPos.xyz);
                    vWorldPosition = position;
                    
                    // --- 1. DYNAMIC FLUID BORDER DISPLACEMENT ---
                    // Tốc độ dòng chảy (flowTime) được giảm mạnh từ 1.6 xuống 0.25 để có bước chuyển dịch uyển chuyển
                    float flowTime = uTime * 0.25;
                    float noiseVal = snoise(position * (0.35 / uDistortion) + vec3(0.0, 0.0, flowTime));
                    
                    // Biến đổi biên dạng chất lỏng siêu chậm
                    vec3 displacedPos = position + normal * noiseVal * (uDistortion * 0.18);
                    
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(displacedPos, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 uColor;
                uniform float uIntensity;
                uniform float uTime;
                uniform float uDistortion;
                varying vec3 vNormal;
                varying vec3 vViewDir;
                varying vec3 vWorldPosition;
                ${simplexNoiseGLSL}
                void main() {
                    // Fresnel hiệu chỉnh viền
                    float fresnel = 1.0 - dot(vNormal, vViewDir);
                    fresnel = pow(fresnel, 2.2);
                    
                    // --- 2. ORGANIC INK DIFFUSION ALGORITHM ---
                    // Giảm tốc độ loang mực từ 1.1 xuống còn 0.15 (Chậm hơn gần 8 lần!)
                    float flowTime = uTime * 0.15;
                    float inkBleed = snoise(vWorldPosition * 0.48 - vec3(flowTime * 0.3, flowTime * 0.5, flowTime * 0.2));
                    
                    // Pha trộn Fresnel với màng loang mực siêu chậm hữu cơ
                    float edgeCutoff = smoothstep(0.08, 0.92, fresnel + inkBleed * 0.32);
                    
                    // Nhịp đập hào quang sâu thẳm, chậm hơn
                    float heartBeat = 0.90 + 0.10 * sin(uTime * 0.85);
                    
                    gl_FragColor = vec4(uColor, edgeCutoff * uIntensity * heartBeat);
                }
            `,
            side: THREE.BackSide,
            blending: THREE.AdditiveBlending,
            transparent: true,
            depthWrite: false
        });
        return new THREE.Mesh(geom, mat);
    }

    // ============================================================
    // RADIAL SHADER ON PLANET CORES (RADIAL RIPPLE WAVE SHADER - GỢN SÓNG TÂM CHẬM)
    // ============================================================
    function createPlanetRippleMesh(radius, colorHex) {
        const geom = new THREE.SphereGeometry(radius * 1.008, 48, 48);
        const mat = new THREE.ShaderMaterial({
            uniforms: {
                uColor: { value: new THREE.Color(colorHex) },
                uTime: { value: 0 }
            },
            vertexShader: `
                varying vec3 vPosition;
                void main() {
                    vPosition = position;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 uColor;
                uniform float uTime;
                varying vec3 vPosition;
                void main() {
                    // Khoảng cách trắc địa từ cực bắc của hành tinh (0, R, 0)
                    float dist = acos(normalize(vPosition).y);
                    
                    // Sóng lan tỏa được giảm tốc độ xuống còn 1.15 (Thay vì 4.2)
                    float ripple = sin(dist * 14.0 - uTime * 1.15) * 0.5 + 0.5;
                    float ring = pow(ripple, 6.0) * 0.38;
                    
                    // Lớp sóng phụ mờ ảo chuyển động siêu chậm (0.45 thay vì 1.8)
                    float ripple2 = sin(dist * 7.0 - uTime * 0.45) * 0.5 + 0.5;
                    float ring2 = pow(ripple2, 4.0) * 0.18;
                    
                    float finalGlow = (ring + ring2) * 0.5;
                    
                    gl_FragColor = vec4(uColor, finalGlow);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        return new THREE.Mesh(geom, mat);
    }

    // ============================================================
    // PLANET & SYSTEM GENERATION
    // ============================================================
    const bodies = [];

    SYSTEM.forEach((data) => {

        // Áp dụng thuật toán Simplex Noise cao cấp cho 0x00 KenvinZone và 0x02 AI Class
        const isOrganicNode = (data.id === 'main' || data.id === 'aiclass');
        const atmo = isOrganicNode 
            ? createOrganicAtmosphereMesh(data.radius, data.atmoColor, isStar, data.id === 'main' ? 1.35 : 0.95)
            : createAtmosphereMesh(data.radius, data.atmoColor, isStar);
        
        mesh.add(atmo);
        mesh.userData.atmo = atmo;

        // Add Core Radial Energy Ripple Overlay
        const ripple = createPlanetRippleMesh(data.radius, data.color);
        mesh.add(ripple);
        mesh.userData.ripple = ripple;

        // Custom Satellite Rings based on IDs
        if (!isStar) {
            if (data.id === 'gold') {
                const ringColors = [0xe8b768, 0xd4a04e, 0xb8884a];
                ringColors.forEach((c, i) => {
                    const inner = data.radius * (1.5 + i * 0.18);
                    const outer = data.radius * (1.62 + i * 0.18);
                    const rg = new THREE.RingGeometry(inner, outer, 96);
                    const rm = new THREE.MeshBasicMaterial({
                        color: c, side: THREE.DoubleSide,
                        transparent: true, opacity: 0.4 - i * 0.08
                    });
                    const r = new THREE.Mesh(rg, rm);
                    r.rotation.x = Math.PI / 2 + 0.4;
                    r.rotation.z = 0.15;
                    mesh.add(r);
                });
                mesh.userData.satRing = mesh.children[mesh.children.length - 1];
            } else if (data.id === 'ainews') {
                const beltGeom = new THREE.BufferGeometry();
                const beltCount = 120;
                const beltPos = new Float32Array(beltCount * 3);
                for (let i = 0; i < beltCount; i++) {
                    const angle = (i / beltCount) * Math.PI * 2;
                    const r = data.radius * (1.5 + Math.random() * 0.3);
                    beltPos[i*3]   = Math.cos(angle) * r;
                    beltPos[i*3+1] = (Math.random() - 0.5) * 0.15;
                    beltPos[i*3+2] = Math.sin(angle) * r;
                }
                beltGeom.setAttribute('position', new THREE.BufferAttribute(beltPos, 3));
                const beltMat = new THREE.PointsMaterial({
                    color: data.color, size: 0.06, transparent: true, opacity: 0.65,
                    blending: THREE.AdditiveBlending, sizeAttenuation: true
                });
                const belt = new THREE.Points(beltGeom, beltMat);
                mesh.add(belt);
                mesh.userData.satRing = belt;
            } else if (data.id === 'aiclass') {
                const r1g = new THREE.RingGeometry(data.radius * 1.4, data.radius * 1.46, 64);
                const r1m = new THREE.MeshBasicMaterial({ color: data.color, side: THREE.DoubleSide, transparent: true, opacity: 0.4 });
                const r1 = new THREE.Mesh(r1g, r1m);
                r1.rotation.x = Math.PI / 2;
                mesh.add(r1);
                mesh.userData.satRing = r1;
            } else if (data.id === 'trading') {
                const cageGeo = new THREE.IcosahedronGeometry(data.radius * 1.55, 0);
                const cageMat = new THREE.MeshBasicMaterial({ color: data.color, wireframe: true, transparent: true, opacity: 0.18 });
                const cage = new THREE.Mesh(cageGeo, cageMat);
                mesh.add(cage);
                mesh.userData.satRing = cage;
            }
        }

        if (isStar) {
            mesh.position.set(0, 0, 0);
            const bigRing = new THREE.RingGeometry(data.radius * 1.6, data.radius * 2.4, 96);
            const bigMat = new THREE.MeshBasicMaterial({
                color: 0xe85a8c, side: THREE.DoubleSide, transparent: true, opacity: 0.1, wireframe: true
            });
            const sunRing = new THREE.Mesh(bigRing, bigMat);
            sunRing.rotation.x = Math.PI / 2 + 0.15;
            mesh.add(sunRing);
            mesh.userData.sunRing = sunRing;
        } else {
            data.angle = Math.random() * Math.PI * 2;
            mesh.position.x = Math.cos(data.angle) * data.distance;
            mesh.position.z = Math.sin(data.angle) * data.distance;
        }

        scene.add(mesh);
        planetMeshes.push(mesh);

        // Orbit Guide Rings with Custom Tech-Pulse Shader
        let orbitMesh = null;
        if (!isStar) {
            const orbitGeom = new THREE.RingGeometry(data.distance - 0.05, data.distance + 0.05, 256);
            const orbitShaderMat = new THREE.ShaderMaterial({
                uniforms: {
                    uColor: { value: new THREE.Color(data.color) },
                    uTime: { value: 0 },
                    uSpeed: { value: data.speed * 2.5 } // Đồng bộ tốc độ quét sáng với hành tinh
                },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform vec3 uColor;
                    uniform float uTime;
                    uniform float uSpeed;
                    varying vec2 vUv;
                    void main() {
                        // vUv.x biểu diễn góc quay theta xung quanh quỹ đạo tròn
                        float theta = vUv.x * 6.2831853;
                        
                        // 1. Tạo hiệu ứng gạch đứt nét công nghệ cao (HUD Radar lines)
                        float dash = step(0.35, sin(vUv.x * 128.0));
                        
                        // 2. Tạo điểm xung sáng (Pulse Node) trượt dọc theo quỹ đạo
                        float pulse = sin(theta + uTime * uSpeed) * 0.5 + 0.5;
                        float laser = pow(pulse, 16.0) * 2.5; // Nén cường độ sáng hẹp rực rỡ
                        
                        // 3. Kết hợp nền quỹ đạo mờ nhạt và xung laser sáng rực
                        float baseGrid = 0.08;
                        float finalAlpha = (baseGrid + laser) * dash;
                        
                        // 4. Bo tròn cạnh của nét vẽ theo hướng radial (Y)
                        float radialFade = sin(vUv.y * 3.1415926);
                        finalAlpha *= pow(radialFade, 1.5);
                        
                        // Pha trộn một chút sắc trắng vào tâm tia quét laser cực mạnh
                        vec3 colorMix = mix(uColor, vec3(1.0, 1.0, 1.0), laser * 0.35);
                        
                        gl_FragColor = vec4(colorMix, finalAlpha);
                    }
                `,
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                side: THREE.DoubleSide
            });
            const orbit = new THREE.Mesh(orbitGeom, orbitShaderMat);
            orbit.rotation.x = Math.PI / 2;
            scene.add(orbit);
            orbitMesh = orbit;
        }

        // Labels
        const label = document.createElement('div');
        label.className = 'planet-label' + (isStar ? ' star-label' : '');
        label.dataset.id = data.id;
        label.style.setProperty('--label-color', hexColor);
        label.style.setProperty('--label-rgb', data.rgb);
        label.innerHTML = `
            <div class="label-inner">
                <div class="label-code">${data.code} · ${data.emoji}</div>
                <div class="label-name">${data.name}</div>
            </div>
            ${isStar ? '' : '<div class="label-connector"></div>'}
        `;
        label.addEventListener('click', () => selectPlanet(mesh));
        label.addEventListener('mouseenter', () => {
            document.body.classList.add('cursor-hover');
            playSound('hover');
        });
        label.addEventListener('mouseleave', () => document.body.classList.remove('cursor-hover'));
        document.body.appendChild(label);

        const bodyObj = { mesh, data, label, orbitMesh };

        // Real-time Planet Trails
        if (!isStar) {
            const trailCount = 80;
            const trailGeom = new THREE.BufferGeometry();
            const trailPos = new Float32Array(trailCount * 3);
            const trailAlpha = new Float32Array(trailCount);
            for (let i = 0; i < trailCount; i++) {
                trailAlpha[i] = 1 - (i / trailCount);
            }
            trailGeom.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
            trailGeom.setAttribute('alpha', new THREE.BufferAttribute(trailAlpha, 1));
            const trailMat = new THREE.ShaderMaterial({
                uniforms: { uColor: { value: new THREE.Color(data.color) } },
                vertexShader: `
                    attribute float alpha;
                    varying float vAlpha;
                    void main() {
                        vAlpha = alpha;
                        vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
                        gl_Position = projectionMatrix * mvPos;
                        gl_PointSize = alpha * 4.0;
                    }
                `,
                fragmentShader: `
                    uniform vec3 uColor;
                    varying float vAlpha;
                    void main() {
                        vec2 c = gl_PointCoord - 0.5;
                        float d = length(c);
                        if (d > 0.5) discard;
                        gl_FragColor = vec4(uColor, vAlpha * (1.0 - d * 2.0) * 0.7);
                    }
                `,
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });
            const trail = new THREE.Points(trailGeom, trailMat);
            scene.add(trail);
            bodyObj.trail = trail;
            bodyObj.trailPositions = trailPos;
        }

        bodies.push(bodyObj);
    });

    // ============================================================
    // STARFIELD BACKGROUNDS
    // ============================================================
    const starLayers = [];
    function createStarfield(count, size, range, colorHex, speed) {
        const geom = new THREE.BufferGeometry();
        const pos = new Float32Array(count * 3);
        const col = new Float32Array(count * 3);
        const baseColor = new THREE.Color(colorHex);
        for (let i = 0; i < count; i++) {
            const r = range.min + Math.random() * (range.max - range.min);
            const theta = 2 * Math.PI * Math.random();
            const phi = Math.acos(2 * Math.random() - 1);
            pos[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
            pos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
            pos[i * 3 + 2] = r * Math.cos(phi);
            const v = 0.7 + Math.random() * 0.3;
            col[i * 3]     = baseColor.r * v;
            col[i * 3 + 1] = baseColor.g * v;
            col[i * 3 + 2] = baseColor.b * v;
        }
        geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        geom.setAttribute('color', new THREE.BufferAttribute(col, 3));
        const mat = new THREE.PointsMaterial({
            size, vertexColors: true, transparent: true, opacity: 0.65,
            blending: THREE.AdditiveBlending, sizeAttenuation: true
        });
        const points = new THREE.Points(geom, mat);
        scene.add(points);
        starLayers.push({ mesh: points, speed });
    }
    createStarfield(1200, 0.4, { min: 50, max: 140 }, 0xd070a0, 0.04);
    createStarfield(1800, 0.55, { min: 100, max: 250 }, 0x8acbd6, 0.02);

    // SPACESHIP ASSEMBLY
    // ============================================================
    function createSpaceship() {
        const ship = new THREE.Group();
        const bodyMat = new THREE.MeshStandardMaterial({
            color: 0xe8eaf6, emissive: 0x5dd5d5, emissiveIntensity: 0.15, roughness: 0.4, metalness: 0.55
        });

        const noseGeom = new THREE.ConeGeometry(0.28, 0.9, 16);
        const nose = new THREE.Mesh(noseGeom, bodyMat);
        nose.position.y = 0.7;
        ship.add(nose);

        const bodyGeom = new THREE.CylinderGeometry(0.28, 0.32, 0.8, 16);
        const body = new THREE.Mesh(bodyGeom, bodyMat);
        body.position.y = -0.15;
        ship.add(body);

        const tailGeom = new THREE.CylinderGeometry(0.32, 0.22, 0.4, 16);
        const tail = new THREE.Mesh(tailGeom, bodyMat);
        tail.position.y = -0.75;
        ship.add(tail);

        const stripeGeom = new THREE.CylinderGeometry(0.281, 0.281, 0.08, 16);
        const stripeMat = new THREE.MeshBasicMaterial({ color: 0x5dd5d5, transparent: true, opacity: 0.85 });
        const stripe = new THREE.Mesh(stripeGeom, stripeMat);
        stripe.position.y = 0.05;
        ship.add(stripe);

        const engineGlowGeom = new THREE.ConeGeometry(0.22, 0.8, 16, 1, true);
        const engineGlowMat = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uColor1: { value: new THREE.Color(0x5dd5d5) },
                uColor2: { value: new THREE.Color(0xe85a8c) }
            },
            vertexShader: `
                varying float vY;
                void main() {
                    vY = position.y;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float uTime;
                uniform vec3 uColor1;
                uniform vec3 uColor2;
                varying float vY;
                void main() {
                    float t = (vY + 0.4) / 0.8;
                    float flicker = sin(uTime * 30.0 + vY * 10.0) * 0.15 + 0.85;
                    vec3 col = mix(uColor2, uColor1, t);
                    float alpha = (1.0 - t) * flicker * 0.85;
                    gl_FragColor = vec4(col, alpha);
                }
            `,
            transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
        });
        const engineGlow = new THREE.Mesh(engineGlowGeom, engineGlowMat);
        engineGlow.position.y = -1.3;
        engineGlow.rotation.x = Math.PI;
        ship.add(engineGlow);
        ship.userData.engineGlow = engineGlow;

        const trailCount = 60;
        const trailGeom = new THREE.BufferGeometry();
        const trailPos = new Float32Array(trailCount * 3);
        const trailAlpha = new Float32Array(trailCount);
        for (let i = 0; i < trailCount; i++) {
            trailAlpha[i] = 1 - (i / trailCount);
        }
        trailGeom.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
        trailGeom.setAttribute('alpha', new THREE.BufferAttribute(trailAlpha, 1));
        const trailMat = new THREE.ShaderMaterial({
            uniforms: { uColor: { value: new THREE.Color(0x5dd5d5) } },
            vertexShader: `
                attribute float alpha;
                varying float vAlpha;
                void main() {
                    vAlpha = alpha;
                    vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
                    gl_Position = projectionMatrix * mvPos;
                    gl_PointSize = alpha * 6.0 + 1.0;
                }
            `,
            fragmentShader: `
                uniform vec3 uColor;
                varying float vAlpha;
                void main() {
                    vec2 c = gl_PointCoord - 0.5;
                    float d = length(c);
                    if (d > 0.5) discard;
                    gl_FragColor = vec4(uColor, vAlpha * (1.0 - d * 2.0) * 0.7);
                }
            `,
            transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
        });
        const trail = new THREE.Points(trailGeom, trailMat);
        scene.add(trail);

        ship.userData.trail = trail;
        ship.userData.trailPositions = trailPos;
        scene.add(ship);
        return ship;
    }

    const spaceship = createSpaceship();

    function shipPathPosition(t) {
        const angle = t * Math.PI * 2.5;
        const radius = 38 - t * 5;
        const heightCurve = Math.sin(t * Math.PI);
        const y = -25 + heightCurve * 40;
