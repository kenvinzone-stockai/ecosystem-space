<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#020005">
    <title>KenvinZone v5.0 — Quantum Observatory</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --bg-void: #020005;
            --bg-deep: #050218;
            --neon-cyan: #00f0ff;
            --neon-magenta: #ff007f;
            --neon-amber: #ffaa00;
            --neon-violet: #b026ff;
            --neon-emerald: #00ffaa;
            --text-primary: #e8eaf6;
            --text-dim: #6b7299;
            --grid-line: rgba(0, 240, 255, 0.06);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-void);
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            cursor: none;
        }

        #cursor-outer, #cursor-inner {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: screen;
            transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #cursor-outer {
            width: 32px; height: 32px;
            border: 1px solid var(--neon-cyan);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 12px rgba(0,240,255,0.5);
        }
        #cursor-inner {
            width: 4px; height: 4px;
            background: var(--neon-magenta);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px var(--neon-magenta);
        }
        .cursor-hover #cursor-outer {
            transform: translate(-50%, -50%) scale(1.6);
            border-color: var(--neon-magenta);
            box-shadow: 0 0 24px var(--neon-magenta);
        }

        @media (hover: none) and (pointer: coarse) {
            html, body { cursor: auto; }
            #cursor-outer, #cursor-inner { display: none; }
        }

        .font-display { font-family: 'Syne', sans-serif; letter-spacing: -0.02em; }
        .font-mono-display { font-family: 'Major Mono Display', monospace; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        .grid-overlay {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 64px 64px;
            pointer-events: none;
            z-index: 2;
            mask-image: radial-gradient(circle at center, transparent 0%, black 80%);
            -webkit-mask-image: radial-gradient(circle at center, transparent 0%, black 80%);
        }

        .vfx-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 3;
        }
        .vfx-overlay::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.15) 50%),
                linear-gradient(90deg, rgba(255,0,127,0.02), rgba(0,240,255,0.02));
            background-size: 100% 3px, 100% 100%;
            opacity: 0.4;
        }
        .vfx-overlay::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%);
        }

        #loading {
            position: fixed;
            inset: 0;
            background: var(--bg-void);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease, visibility 1s ease;
        }
        #loading.hidden {
            opacity: 0;
            visibility: hidden;
        }
        .loading-logo {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: clamp(2.5rem, 8vw, 5rem);
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta) 60%, var(--neon-amber));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.04em;
            margin-bottom: 0.5rem;
            position: relative;
        }
        .loading-logo::after {
            content: 'v5.0';
            position: absolute;
            top: 0.4em;
            right: -2.2em;
            font-size: 0.2em;
            font-family: 'JetBrains Mono', monospace;
            background: var(--neon-magenta);
            color: white;
            padding: 2px 6px;
            -webkit-background-clip: initial;
            background-clip: initial;
            font-weight: 400;
            letter-spacing: 0;
        }
        .loading-subtitle {
            font-family: 'Major Mono Display', monospace;
            font-size: 0.7rem;
            color: var(--neon-cyan);
            letter-spacing: 0.5em;
            text-transform: uppercase;
            margin-bottom: 3rem;
            opacity: 0.7;
        }
        .loading-progress-bar {
            width: min(320px, 70vw);
            height: 2px;
            background: rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
        }
        .loading-progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
            box-shadow: 0 0 20px var(--neon-cyan);
            transition: width 0.3s ease;
        }
        .loading-status {
            margin-top: 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 0.1em;
            height: 1rem;
        }
        .loading-status::before {
            content: '> ';
            color: var(--neon-magenta);
        }
        .loading-error {
            margin-top: 1.5rem;
            padding: 0.75rem 1rem;
            border: 1px solid var(--neon-magenta);
            background: rgba(255, 0, 127, 0.08);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--neon-magenta);
            max-width: 380px;
            text-align: center;
            display: none;
        }
        .loading-error.show { display: block; }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 1.5rem 2rem;
            pointer-events: none;
        }
        .top-bar > * { pointer-events: auto; }

        .brand-block { display: flex; flex-direction: column; }
        .brand-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--neon-cyan);
            letter-spacing: 0.3em;
            opacity: 0.7;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .brand-tag::before {
            content: '';
            width: 6px; height: 6px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-cyan);
            animation: pulse-dot 2s infinite ease-in-out;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }
        .brand-name {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: clamp(1.5rem, 3vw, 2.25rem);
            letter-spacing: -0.04em;
            line-height: 1;
            background: linear-gradient(120deg, var(--neon-cyan) 0%, #ffffff 40%, var(--neon-magenta) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .brand-version {
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.55rem;
            background: var(--neon-magenta);
            color: white;
            padding: 1px 6px;
            margin-left: 0.5rem;
            vertical-align: middle;
            letter-spacing: 0.1em;
        }

        .status-block {
            text-align: right;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
        }
        .status-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.2rem;
            color: var(--text-dim);
        }
        .status-row strong {
            color: var(--text-primary);
            font-weight: 500;
        }
        .status-row .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot-green { background: var(--neon-emerald); box-shadow: 0 0 6px var(--neon-emerald); }
        .dot-amber { background: var(--neon-amber); box-shadow: 0 0 6px var(--neon-amber); }
        .dot-cyan  { background: var(--neon-cyan);    box-shadow: 0 0 6px var(--neon-cyan); }

        .side-nav {
            position: fixed;
            left: 2rem;
            top: 50%;
            transform: translateY(-50%);
            z-index: 15;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            pointer-events: auto;
        }
        .nav-node {
            position: relative;
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0;
            cursor: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .nav-node-dot {
            width: 10px; height: 10px;
            background: transparent;
            border: 1.5px solid var(--node-color, var(--text-dim));
            border-radius: 50%;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }
        .nav-node-line {
            width: 16px;
            height: 1px;
            background: var(--node-color, var(--text-dim));
            opacity: 0.4;
            transition: all 0.3s ease;
        }
        .nav-node-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-dim);
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        .nav-node:hover .nav-node-dot {
            background: var(--node-color);
            box-shadow: 0 0 16px var(--node-color);
            transform: scale(1.3);
        }
        .nav-node:hover .nav-node-line {
            width: 32px;
            opacity: 1;
        }
        .nav-node:hover .nav-node-label {
            opacity: 1;
            transform: translateX(0);
            color: var(--node-color);
        }
        .nav-node.active .nav-node-dot {
            background: var(--node-color);
            box-shadow: 0 0 16px var(--node-color);
        }
        .nav-node.active .nav-node-label {
            opacity: 1;
            transform: translateX(0);
            color: var(--node-color);
        }

        .ai-terminal {
            position: fixed;
            right: 2rem;
            top: 50%;
            transform: translateY(-50%);
            z-index: 15;
            width: 400px;
            max-height: 70vh;
            display: flex;
            flex-direction: column;
            background: rgba(5, 2, 24, 0.6);
            border: 1px solid rgba(0, 240, 255, 0.15);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }
        .ai-terminal::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--neon-magenta), transparent);
        }
        .ai-terminal::after {
            content: '';
            position: absolute;
            top: -1px; right: -1px;
            width: 24px; height: 24px;
            border-top: 1px solid var(--neon-cyan);
            border-right: 1px solid var(--neon-cyan);
        }
        .ai-terminal.collapsed {
            max-height: 56px;
        }

        .terminal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.9rem 1.1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(0, 0, 0, 0.3);
            cursor: none;
            flex-shrink: 0;
        }
        .terminal-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-family: 'Major Mono Display', monospace;
            font-size: 0.75rem;
            color: var(--neon-magenta);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }
        .terminal-title-dot {
            position: relative;
            width: 8px; height: 8px;
        }
        .terminal-title-dot::before, .terminal-title-dot::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: var(--neon-magenta);
        }
        .terminal-title-dot::after {
            animation: ping 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
        }
        @keyframes ping {
            75%, 100% { transform: scale(2.5); opacity: 0; }
        }
        .terminal-action {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--neon-cyan);
            background: transparent;
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 0.3rem 0.6rem;
            letter-spacing: 0.1em;
            transition: all 0.2s ease;
            cursor: none;
        }
        .terminal-action:hover {
            background: var(--neon-cyan);
            color: var(--bg-void);
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }
        .chat-box::-webkit-scrollbar { width: 3px; }
        .chat-box::-webkit-scrollbar-track { background: transparent; }
        .chat-box::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--neon-cyan), var(--neon-magenta));
        }

        .msg {
            display: flex;
            gap: 0.75rem;
            animation: msg-in 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes msg-in {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-avatar {
            width: 28px; height: 28px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Major Mono Display', monospace;
            font-size: 0.6rem;
            letter-spacing: 0.1em;
        }
        .msg.ai .msg-avatar {
            background: rgba(255, 0, 127, 0.1);
            border: 1px solid var(--neon-magenta);
            color: var(--neon-magenta);
        }
        .msg.user .msg-avatar {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
        }
        .msg-body {
            flex: 1;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            line-height: 1.65;
        }
        .msg.ai .msg-body { color: #e8eaf6; }
        .msg.user .msg-body {
            color: var(--neon-cyan);
            opacity: 0.85;
            font-size: 0.72rem;
            padding-top: 0.4rem;
        }
        .msg-body p { margin: 0 0 0.5rem 0; }
        .msg-body p:last-child { margin-bottom: 0; }
        .msg-body strong {
            color: var(--neon-amber);
            font-weight: 500;
        }
        .msg-body em {
            color: var(--neon-magenta);
            font-style: normal;
        }
        .msg-body code {
            background: rgba(0, 240, 255, 0.1);
            padding: 1px 5px;
            color: var(--neon-cyan);
            font-size: 0.9em;
        }
        .msg-body ul, .msg-body ol {
            padding-left: 1.2rem;
            margin: 0.5rem 0;
        }
        .msg-body li { margin-bottom: 0.25rem; }
        .msg-body a {
            color: var(--neon-cyan);
            text-decoration: none;
            border-bottom: 1px dashed var(--neon-cyan);
        }

        .typing-cursor {
            display: inline-block;
            width: 8px;
            height: 1em;
            background: var(--neon-magenta);
            vertical-align: text-bottom;
            margin-left: 2px;
            animation: blink 1s steps(2) infinite;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            50.01%, 100% { opacity: 0; }
        }

        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            padding: 0.75rem 1rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            background: rgba(0,0,0,0.2);
            flex-shrink: 0;
        }
        .quick-btn {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.62rem;
            background: transparent;
            border: 1px solid var(--btn-color, var(--neon-cyan));
            color: var(--btn-color, var(--neon-cyan));
            padding: 0.35rem 0.7rem;
            letter-spacing: 0.05em;
            transition: all 0.2s ease;
            cursor: none;
            opacity: 0.7;
        }
        .quick-btn:hover {
            background: var(--btn-color);
            color: var(--bg-void);
            opacity: 1;
            box-shadow: 0 0 16px var(--btn-color);
        }

        .input-area {
            display: flex;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            background: rgba(0,0,0,0.3);
            flex-shrink: 0;
        }
        .input-area input {
            flex: 1;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(0,240,255,0.2);
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            padding: 0.55rem 0.75rem;
            outline: none;
            cursor: none;
            transition: border-color 0.2s ease;
        }
        .input-area input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
        }
        .input-area input::placeholder { color: var(--text-dim); }
        .send-btn {
            background: transparent;
            border: 1px solid var(--neon-magenta);
            color: var(--neon-magenta);
            padding: 0 1rem;
            font-family: 'Major Mono Display', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            cursor: none;
            transition: all 0.2s ease;
        }
        .send-btn:hover {
            background: var(--neon-magenta);
            color: white;
            box-shadow: 0 0 20px var(--neon-magenta);
        }

        .planet-hud {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translate(-50%, 40px);
            z-index: 18;
            opacity: 0;
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: stretch;
            background: rgba(5, 2, 24, 0.75);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(0, 240, 255, 0.2);
            max-width: 90vw;
            min-width: 480px;
        }
        .planet-hud.visible {
            opacity: 1;
            transform: translate(-50%, 0);
            pointer-events: auto;
        }
        .planet-hud::before {
            content: '';
            position: absolute;
            bottom: -1px; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--hud-color, var(--neon-magenta)), transparent);
        }

        .planet-hud-emoji {
            width: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            border-right: 1px solid rgba(255,255,255,0.06);
            background: rgba(0,0,0,0.2);
            position: relative;
        }
        .planet-hud-emoji::after {
            content: '';
            position: absolute;
            top: 8px; left: 8px;
            width: 12px; height: 12px;
            border-top: 1px solid var(--hud-color);
            border-left: 1px solid var(--hud-color);
        }
        .planet-hud-info {
            padding: 1rem 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 200px;
        }
        .planet-hud-id {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            color: var(--text-dim);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }
        .planet-hud-name {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--hud-color, white);
            line-height: 1;
            margin-bottom: 0.4rem;
            letter-spacing: -0.02em;
        }
        .planet-hud-desc {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--text-dim);
            line-height: 1.5;
            max-width: 280px;
        }
        .planet-hud-actions {
            display: flex;
            border-left: 1px solid rgba(255,255,255,0.06);
        }
        .hud-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0 1.5rem;
            background: transparent;
            border: none;
            border-right: 1px solid rgba(255,255,255,0.06);
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: none;
            transition: all 0.2s ease;
        }
        .hud-btn:last-child { border-right: none; }
        .hud-btn:hover {
            background: var(--hud-color);
            color: var(--bg-void);
        }
        .hud-btn.primary { color: var(--neon-cyan); }
        .hud-btn.primary:hover {
            background: var(--neon-cyan);
            color: var(--bg-void);
        }

        .minimap {
            position: fixed;
            bottom: 2rem;
            left: 2rem;
            z-index: 15;
            width: 140px;

    <!-- Three.js UMD bundle - chạy được trên file:// -->
    <script src="https://unpkg.com/three@0.135.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.135.0/examples/js/controls/OrbitControls.js"></script>

    <script src="https://unpkg.com/three@0.135.0/examples/js/postprocessing/EffectComposer.js"></script>

    <script src="https://unpkg.com/three@0.135.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://unpkg.com/three@0.135.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://unpkg.com/three@0.135.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <script>
    // Đợi cho tất cả script load xong trước khi chạy
    function checkLibrariesReady() {
        if (typeof THREE === 'undefined') return 'Three.js core';
        if (typeof THREE.OrbitControls === 'undefined') return 'OrbitControls';
        if (typeof THREE.EffectComposer === 'undefined') return 'EffectComposer';
        if (typeof THREE.RenderPass === 'undefined') return 'RenderPass';
        if (typeof THREE.ShaderPass === 'undefined') return 'ShaderPass';
        if (typeof THREE.UnrealBloomPass === 'undefined') return 'UnrealBloomPass';
        if (typeof marked === 'undefined') return 'Marked.js';
        return null;
    }

    function waitForLibraries(callback, attemptsLeft = 50) {
        const missing = checkLibrariesReady();
        if (!missing) {
            callback();
            return;
        }
        if (attemptsLeft <= 0) {
            const errEl = document.getElementById('loading-error');
            errEl.classList.add('show');
            errEl.innerHTML = `<strong>⚠ CONNECTION FAILURE</strong><br>Không tải được: <code>${missing}</code><br>Vui lòng kiểm tra kết nối internet và reload trang.`;
            document.getElementById('loading-status').textContent = 'Library load timeout';
            return;
        }
        document.getElementById('loading-status').textContent = `Loading ${missing}...`;
        setTimeout(() => waitForLibraries(callback, attemptsLeft - 1), 200);
    }

    waitForLibraries(initApp);

    function initApp() {
    // ============================================================
    // KENVINZONE v5.0 — QUANTUM OBSERVATORY (UMD VERSION)
    // ============================================================

    const SYSTEM = [
        { id: 'main', code: '0x00', name: 'KenvinZone', type: 'star',
          url: 'https://kenvinzone.com',
          radius: 3.5, color: 0xe85a8c, emissive: 0xd14e7a, atmoColor: 0xe85a8c,
          desc: 'Tổ hợp trung tâm — gateway lượng tử kết nối toàn bộ ecosystem',
          emoji: '🌟', rgb: '232, 90, 140' },
        { id: 'vnindex', code: '0x01', name: 'VN-Index', type: 'planet',
          url: 'https://vnindex.kenvinzone.com',
          radius: 1.5, distance: 13, speed: 0.18, color: 0x5dd5d5, atmoColor: 0x5dd5d5,
          desc: 'Dữ liệu bảng giá & chỉ số TTCK Việt Nam — tracking real-time',
          emoji: '📈', rgb: '93, 213, 213' },
        { id: 'aiclass', code: '0x02', name: 'AI Class', type: 'planet',
          url: 'https://aiclass.kenvinzone.com',
          radius: 1.7, distance: 18, speed: 0.14, color: 0xb08fd8, atmoColor: 0xb08fd8,
          desc: 'Lớp học AI thế hệ mới — workshop, training, build & deploy',
          emoji: '🎓', rgb: '176, 143, 216' },
        { id: 'trading', code: '0x03', name: 'Trading Tool', type: 'planet',
          url: 'https://tradingtool.kenvinzone.com',
          radius: 1.4, distance: 23, speed: 0.11, color: 0xe8b768, atmoColor: 0xe8b768,
          desc: 'Công cụ phân tích kỹ thuật & trợ lý giao dịch thông minh',
          emoji: '🛠️', rgb: '232, 183, 104' },
        { id: 'gold', code: '0x04', name: 'Gold & Nasdaq', type: 'planet',
          url: 'https://gold-nasdaq.kenvinzone.com',
          radius: 1.6, distance: 28, speed: 0.085, color: 0x7dc9a5, atmoColor: 0x7dc9a5,
          desc: 'Tín hiệu thị trường Vàng và NASDAQ — coverage 24/7',
          emoji: '🟡', rgb: '125, 201, 165' },
        { id: 'ainews', code: '0x05', name: 'AI News', type: 'planet',
          url: 'https://ainews.kenvinzone.com',
          radius: 1.3, distance: 33, speed: 0.065, color: 0x8a9fd9, atmoColor: 0x8a9fd9,
          desc: 'Dòng tin AI, neural networks, LLMs — curated daily',
          emoji: '📰', rgb: '138, 159, 217' }
    ];

    const loadingSteps = [
        'Initializing quantum core',
        'Calibrating depth buffer',
        'Generating procedural starfields',
        'Compiling atmosphere shaders',
        'Spawning planetary nodes',
        'Wiring AI neural pipeline',
        'Locking orbital trajectories',
        'Observatory online'
    ];
    let loadingStep = 0;
    const loadFill = document.getElementById('loading-fill');
    const loadStatus = document.getElementById('loading-status');
    function advanceLoading() {
        if (loadingStep < loadingSteps.length) {
            loadStatus.textContent = loadingSteps[loadingStep];
            loadFill.style.width = `${((loadingStep + 1) / loadingSteps.length) * 100}%`;
            loadingStep++;
        }
    }
    const loadInterval = setInterval(advanceLoading, 280);

    // ============================================================
    // SCENE SETUP
    // ============================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x080418, 0.0085);  // Fog nhẹ hơn (0.011→0.0085), tone hơi xanh tím

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, 55, 90);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.85;  // Giảm từ 1.15 → tổng thể dịu hơn
    if (THREE.SRGBColorSpace !== undefined) {
        renderer.outputColorSpace = THREE.SRGBColorSpace;
    } else {
        renderer.outputEncoding = THREE.sRGBEncoding;
    }
    container.appendChild(renderer.domElement);

    // ============================================================
    // POST-PROCESSING
    // ============================================================
    const composer = new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene, camera));

    // Bloom rất nhẹ - chỉ làm cho rim light hơi mềm, không "phát sáng" lan tỏa
    const bloomPass = new THREE.UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        0.18,  // strength rất thấp
        0.5,   // radius rộng để bloom mềm và mượt
        0.7    // threshold cao - chỉ vùng cực sáng mới bloom
    );
    composer.addPass(bloomPass);

    const finalShader = {
        uniforms: {
            tDiffuse: { value: null },
            uTime: { value: 0 },
            uAberration: { value: 0.0003 },  // Gần như không thấy
            uGrain: { value: 0.015 }          // Grain rất nhẹ - vừa đủ "atmosphere"
        },
        vertexShader: `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `,
        fragmentShader: `
            uniform sampler2D tDiffuse;
            uniform float uTime;
            uniform float uAberration;
            uniform float uGrain;
            varying vec2 vUv;
            float rand(vec2 co){
                return fract(sin(dot(co.xy, vec2(12.9898,78.233))) * 43758.5453);
            }
            void main() {
                vec2 uv = vUv;
                vec2 dir = uv - 0.5;
                float dist = length(dir);
                float ca = uAberration * (1.0 + dist * 1.5);
                float r = texture2D(tDiffuse, uv - dir * ca).r;
                float g = texture2D(tDiffuse, uv).g;
                float b = texture2D(tDiffuse, uv + dir * ca).b;
                float a = texture2D(tDiffuse, uv).a;
                vec3 color = vec3(r, g, b);
                float grain = rand(uv + uTime * 0.001) - 0.5;
                color += grain * uGrain;
                color *= 1.0 - dist * 0.35;
                gl_FragColor = vec4(color, a);
            }
        `
    };
    const finalPass = new THREE.ShaderPass(finalShader);
    finalPass.renderToScreen = true;
    composer.addPass(finalPass);

    // ============================================================
    // CONTROLS
    // ============================================================
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 180;
    controls.minDistance = 8;
    controls.maxPolarAngle = Math.PI / 2 + 0.05;
    controls.minPolarAngle = 0.1;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.25;

    // ============================================================
    // LIGHTING
    // ============================================================
    // Lighting tinh chỉnh cho cảm giác dịu nhẹ
    scene.add(new THREE.AmbientLight(0xb8c5e5, 0.45));  // Ambient tăng mạnh, ngả lavender nhẹ
    // Hemisphere light: bầu trời cyan trên, đất tối dưới - tạo gradient ánh sáng tự nhiên
    const hemiLight = new THREE.HemisphereLight(0x7da8d9, 0x1a0a2e, 0.35);
    scene.add(hemiLight);
    const coreLight = new THREE.PointLight(0xe85a8c, 22, 160, 1.8);  // Giảm intensity 50→22
    scene.add(coreLight);
    const coreLight2 = new THREE.PointLight(0x9ec5e8, 12, 120, 1.4);  // Cyan→softer blue
    scene.add(coreLight2);
    // Fill light từ trên - mềm mại
    const fillLight = new THREE.DirectionalLight(0xaab8d8, 0.25);
    fillLight.position.set(0, 50, 30);
    scene.add(fillLight);

    // ============================================================
    // BẢN SẮC TEXTURE — MỖI NODE CÓ DNA RIÊNG
    // ============================================================

    // Helper: tạo base canvas + gradient nền chung
    function createBaseCanvas() {
        const canvas = document.createElement('canvas');
        canvas.width = 2048;
        canvas.height = 1024;
        const ctx = canvas.getContext('2d');
        const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
        g.addColorStop(0, '#04010a');
        g.addColorStop(0.5, '#0a0316');
        g.addColorStop(1, '#02010d');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        return { canvas, ctx };
    }

    // Helper: finalize → trả về CanvasTexture
    function toTexture(canvas) {
        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        return texture;
    }

    // ============================================================
    // 🌟 KENVINZONE CORE (star): trung tâm — lưới lượng tử + plasma
    // ============================================================
    function textureKenvinZone(hexColor) {
        const { canvas, ctx } = createBaseCanvas();
        // Plasma blobs - ít hơn và mờ hơn để không bị "phát nổ"
        for (let i = 0; i < 14; i++) {
            ctx.globalAlpha = Math.random() * 0.18 + 0.05;
            const cx = Math.random() * canvas.width;
            const cy = Math.random() * canvas.height;
            const r = Math.random() * 250 + 80;
            const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
            grad.addColorStop(0, hexColor);
            grad.addColorStop(0.5, '#ff3377');
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad;
            ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
        }
        // Quantum grid - thưa hơn
        ctx.strokeStyle = hexColor;
        ctx.lineWidth = 1;
        ctx.globalAlpha = 0.3;
        for (let y = 0; y < canvas.height; y += 40) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }
        for (let x = 0; x < canvas.width; x += 80) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        // Equator band — vẫn rực rỡ nhưng vừa phải
        ctx.globalAlpha = 0.7;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(0, canvas.height / 2);
        ctx.lineTo(canvas.width, canvas.height / 2);
        ctx.stroke();
        // KV-CORE branding - ít hơn
        ctx.globalAlpha = 0.5;
        ctx.font = 'bold 26px "JetBrains Mono", monospace';
        ctx.fillStyle = '#ffffff';
        for (let i = 0; i < 4; i++) {
            ctx.fillText('KV-CORE', Math.random() * canvas.width, Math.random() * canvas.height);
        }
        return toTexture(canvas);
    }

    // ============================================================
    // 📈 VN-INDEX: candlestick chart pattern
    // ============================================================
    function textureVNIndex(hexColor) {
        const { canvas, ctx } = createBaseCanvas();
        // Background grid (chart paper)
        ctx.strokeStyle = hexColor;
        ctx.globalAlpha = 0.12;
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += 40) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += 40) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }

        // Candlesticks across multiple bands
        const bands = [180, 440, 720, 1000];
        bands.forEach(baseY => {
            let prevY = baseY;
            for (let x = 20; x < canvas.width; x += 28) {
                const isGreen = Math.random() > 0.45;
                const candleColor = isGreen ? '#00ff88' : '#ff3355';
                const high = prevY + (Math.random() - 0.5) * 80;
                const low = high + (Math.random() * 50 + 20) * (isGreen ? -1 : 1);
                const openClose = [high, low].sort((a, b) => a - b);

                ctx.globalAlpha = 0.85;
                // Wick
                ctx.strokeStyle = candleColor;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(x + 8, openClose[0] - 8);
                ctx.lineTo(x + 8, openClose[1] + 8);
                ctx.stroke();
                // Body
                ctx.fillStyle = candleColor;
                ctx.fillRect(x + 3, openClose[0], 10, openClose[1] - openClose[0]);
                prevY = (openClose[0] + openClose[1]) / 2;
            }
        });

        // VN-INDEX text tags
        ctx.globalAlpha = 0.6;
        ctx.font = 'bold 22px "JetBrains Mono", monospace';
        ctx.fillStyle = hexColor;
        for (let i = 0; i < 5; i++) {
            const tx = Math.random() * (canvas.width - 200);
            const ty = Math.random() * canvas.height;
            ctx.fillText(`VNI ${(1200 + Math.random() * 100).toFixed(2)}`, tx, ty);
        }

        // Volume bars at bottom
        ctx.globalAlpha = 0.3;
        ctx.fillStyle = hexColor;
        for (let x = 0; x < canvas.width; x += 16) {
            const h = Math.random() * 80 + 20;
            ctx.fillRect(x, canvas.height - h, 10, h);
        }
        return toTexture(canvas);
    }

    // ============================================================
    // 🎓 AI CLASS: neural network nodes & connections
    // ============================================================
    function textureAIClass(hexColor) {
        const { canvas, ctx } = createBaseCanvas();
        // Generate neuron positions in layers
        const layers = 6;
        const layerWidth = canvas.width / layers;
        const neurons = [];
        for (let l = 0; l < layers; l++) {
            const count = 4 + Math.floor(Math.random() * 6);
            for (let i = 0; i < count; i++) {
                neurons.push({
                    x: l * layerWidth + layerWidth / 2 + (Math.random() - 0.5) * 50,
                    y: (i + 0.5) * (canvas.height / count) + (Math.random() - 0.5) * 60,
                    layer: l,
                    size: Math.random() * 8 + 6
                });
            }
        }
        // Synaptic connections between adjacent layers
        ctx.strokeStyle = hexColor;
        ctx.lineWidth = 0.6;
        neurons.forEach(n1 => {
            neurons.forEach(n2 => {
                if (n2.layer === n1.layer + 1 && Math.random() > 0.5) {
                    ctx.globalAlpha = Math.random() * 0.3 + 0.1;
                    ctx.beginPath();
                    ctx.moveTo(n1.x, n1.y);
                    ctx.lineTo(n2.x, n2.y);
                    ctx.stroke();
                }
            });
        });
        // Neuron nodes
        neurons.forEach(n => {
            const grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.size * 2);
            grad.addColorStop(0, hexColor);
            grad.addColorStop(0.5, hexColor + '88');
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad;
            ctx.globalAlpha = 0.8;
            ctx.fillRect(n.x - n.size * 2, n.y - n.size * 2, n.size * 4, n.size * 4);
            // Core dot
            ctx.fillStyle = '#ffffff';
            ctx.globalAlpha = 0.9;
            ctx.beginPath();
            ctx.arc(n.x, n.y, n.size / 3, 0, Math.PI * 2);
            ctx.fill();
        });
        // Math/AI notation
        ctx.globalAlpha = 0.5;
        ctx.font = '18px "JetBrains Mono", monospace';
        ctx.fillStyle = hexColor;
        const formulas = ['σ(z)', 'ReLU', 'softmax', '∇θ J', 'w·x+b', 'L(y,ŷ)', 'epoch+1'];
        for (let i = 0; i < 12; i++) {
            ctx.fillText(formulas[Math.floor(Math.random() * formulas.length)],
                Math.random() * canvas.width, Math.random() * canvas.height);
        }
        return toTexture(canvas);
    }

    // ============================================================
    // 🛠️ TRADING TOOL: technical indicators & ticker bars
    // ============================================================
    function textureTradingTool(hexColor) {
        const { canvas, ctx } = createBaseCanvas();
        // Ticker tape rows
        const rowH = 60;
        for (let row = 0; row < canvas.height / rowH; row++) {
            const y = row * rowH;
            // Dark band
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.fillRect(0, y + 5, canvas.width, rowH - 10);
            // Ticker symbols
            ctx.font = 'bold 16px "JetBrains Mono", monospace';
            let x = 20;
            while (x < canvas.width) {
                const symbols = ['VIC', 'VHM', 'HPG', 'FPT', 'MWG', 'VNM', 'VCB', 'TCB'];
                const sym = symbols[Math.floor(Math.random() * symbols.length)];
                const isUp = Math.random() > 0.5;
                ctx.fillStyle = '#ffffff';
                ctx.globalAlpha = 0.7;
                ctx.fillText(sym, x, y + 25);
                ctx.fillStyle = isUp ? '#00ff88' : '#ff3355';
                ctx.fillText(`${isUp ? '▲' : '▼'}${(Math.random() * 5).toFixed(2)}%`, x + 50, y + 25);
                x += 180;
            }
        }
        // MACD-like wave overlay
        ctx.strokeStyle = hexColor;
        ctx.lineWidth = 3;
        ctx.globalAlpha = 0.7;
        ctx.beginPath();
        for (let x = 0; x < canvas.width; x += 5) {
            const y = canvas.height / 2 + Math.sin(x * 0.012) * 80 + Math.cos(x * 0.04) * 40;
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
        // RSI band
        ctx.fillStyle = hexColor;
        ctx.globalAlpha = 0.2;
        ctx.fillRect(0, canvas.height * 0.7, canvas.width, 4);
        ctx.fillRect(0, canvas.height * 0.3, canvas.width, 4);
        return toTexture(canvas);
    }

    // ============================================================
    // 🟡 GOLD & NASDAQ: metallic gold finish + market tickers

    function textureGoldNasdaq(hexColor) {

    // ============================================================
    // ROUTER: chọn texture theo id
    // ============================================================
    function createPlanetTexture(hexColor, isStar, label) {
        switch (label) {
            case 'main':    return textureKenvinZone(hexColor);
            case 'vnindex': return textureVNIndex(hexColor);
            case 'aiclass': return textureAIClass(hexColor);
            case 'trading': return textureTradingTool(hexColor);
            case 'gold':    return textureGoldNasdaq(hexColor);
            case 'ainews':  return textureAINews(hexColor);
            default:        return textureKenvinZone(hexColor);
        }
    }

    function createAtmosphereMesh(radius, colorHex, isStar) {
        const color = new THREE.Color(colorHex);
        const geom = new THREE.SphereGeometry(radius * (isStar ? 1.1 : 1.14), 48, 48);
        const mat = new THREE.ShaderMaterial({
            uniforms: {
                uColor: { value: color },
                uIntensity: { value: isStar ? 0.35 : 0.55 }  // Halo nhẹ hơn nhiều
            },
            vertexShader: `
                varying vec3 vNormal;
                varying vec3 vViewDir;
                void main() {
                    vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
                    vNormal = normalize(normalMatrix * normal);
                    vViewDir = normalize(-mvPos.xyz);
                    gl_Position = projectionMatrix * mvPos;
                }
            `,
            fragmentShader: `
                uniform vec3 uColor;
                uniform float uIntensity;
                varying vec3 vNormal;
                varying vec3 vViewDir;
                void main() {
                    float fresnel = 1.0 - dot(vNormal, vViewDir);
                    fresnel = pow(fresnel, 3.5);
                    gl_FragColor = vec4(uColor, fresnel * uIntensity);
                }
            `,
            side: THREE.BackSide,
            blending: THREE.AdditiveBlending,
            transparent: true,
            depthWrite: false
        });
        return new THREE.Mesh(geom, mat);
    }

    // ============================================================
    // PLANET CONSTRUCTION
    // ============================================================
    const bodies = [];
    const planetMeshes = [];

    SYSTEM.forEach((data) => {
        const hexColor = '#' + data.color.toString(16).padStart(6, '0');
        const texture = createPlanetTexture(hexColor, data.type === 'star', data.id);

        const isStar = data.type === 'star';
        const segments = isStar ? 64 : 48;
        const geom = new THREE.SphereGeometry(data.radius, segments, segments);
        const mat = new THREE.MeshStandardMaterial({
            map: texture,
            emissive: data.emissive || data.color,
            emissiveMap: texture,
            emissiveIntensity: isStar ? 0.7 : 0.25,  // Giảm mạnh để không "tự phát sáng" gay gắt
            roughness: isStar ? 0.5 : 0.85,           // Tăng roughness mạnh - bề mặt matte, không lóa
            metalness: data.id === 'gold' ? 0.4 : 0.15  // Giảm metalness mạnh - ít phản chiếu hơn
        });
        const mesh = new THREE.Mesh(geom, mat);
        mesh.userData = Object.assign({}, data, { baseEmissive: isStar ? 0.7 : 0.25 });

        const atmo = createAtmosphereMesh(data.radius, data.atmoColor, isStar);
        mesh.add(atmo);
        mesh.userData.atmo = atmo;

        if (!isStar) {
            // Mỗi hành tinh có style ring riêng
            if (data.id === 'gold') {
                // 🟡 Gold: Saturn-style multiple rings (pastel gold tones)
                const ringColors = [0xe8b768, 0xd4a04e, 0xb8884a];
                ringColors.forEach((c, i) => {
                    const inner = data.radius * (1.5 + i * 0.18);
                    const outer = data.radius * (1.62 + i * 0.18);
                    const rg = new THREE.RingGeometry(inner, outer, 96);
                    const rm = new THREE.MeshBasicMaterial({
                        color: c, side: THREE.DoubleSide,
                        transparent: true, opacity: 0.4 - i * 0.08  // Giảm opacity
                    });
                    const r = new THREE.Mesh(rg, rm);
                    r.rotation.x = Math.PI / 2 + 0.4;
                    r.rotation.z = 0.15;
                    mesh.add(r);
                });
                mesh.userData.satRing = mesh.children[mesh.children.length - 1];
            } else if (data.id === 'ainews') {
                // 📰 AI News: asteroid belt - particles xoay xung quanh
                const beltGeom = new THREE.BufferGeometry();
                const beltCount = 120;
                const beltPos = new Float32Array(beltCount * 3);
                for (let i = 0; i < beltCount; i++) {
                    const angle = (i / beltCount) * Math.PI * 2;
                    const r = data.radius * (1.5 + Math.random() * 0.3);
                    beltPos[i*3]   = Math.cos(angle) * r;
                    beltPos[i*3+1] = (Math.random() - 0.5) * 0.15;
                    beltPos[i*3+2] = Math.sin(angle) * r;
                }
                beltGeom.setAttribute('position', new THREE.BufferAttribute(beltPos, 3));
                const beltMat = new THREE.PointsMaterial({
                    color: data.color,
                    size: 0.06,
                    transparent: true,
                    opacity: 0.65,  // Giảm 0.85→0.65
                    blending: THREE.AdditiveBlending,
                    sizeAttenuation: true
                });
                const belt = new THREE.Points(beltGeom, beltMat);
                mesh.add(belt);
                mesh.userData.satRing = belt;
            } else if (data.id === 'aiclass') {
                // 🎓 AI Class: double ring perpendicular
                const r1g = new THREE.RingGeometry(data.radius * 1.4, data.radius * 1.46, 64);
                const r1m = new THREE.MeshBasicMaterial({
                    color: data.color, side: THREE.DoubleSide,
                    transparent: true, opacity: 0.4
                });
                const r1 = new THREE.Mesh(r1g, r1m);
                r1.rotation.x = Math.PI / 2;
                mesh.add(r1);

                const r2g = new THREE.RingGeometry(data.radius * 1.5, data.radius * 1.54, 64);
                const r2m = new THREE.MeshBasicMaterial({
                    color: data.color, side: THREE.DoubleSide,
                    transparent: true, opacity: 0.3
                });
                const r2 = new THREE.Mesh(r2g, r2m);
                r2.rotation.x = 0;
                r2.rotation.y = Math.PI / 4;
                mesh.add(r2);
                mesh.userData.satRing = r2;
            } else if (data.id === 'trading') {
                // 🛠️ Trading: wireframe orbital cage
                const cageGeo = new THREE.IcosahedronGeometry(data.radius * 1.55, 0);
                const cageMat = new THREE.MeshBasicMaterial({
                    color: data.color,
                    wireframe: true,
                    transparent: true,
                    opacity: 0.18  // Giảm 0.25→0.18
                });
                const cage = new THREE.Mesh(cageGeo, cageMat);
                mesh.add(cage);
                mesh.userData.satRing = cage;
            } else {
                // 📈 VN-Index và default
                const ringGeom = new THREE.RingGeometry(data.radius * 1.35, data.radius * 1.4, 64);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: data.color, side: THREE.DoubleSide,
                    transparent: true, opacity: 0.4  // Giảm 0.55→0.4
                });
                const ring = new THREE.Mesh(ringGeom, ringMat);
                ring.rotation.x = Math.PI / 2 + Math.random() * 0.4 - 0.2;
                ring.rotation.z = Math.random() * 0.3;
                mesh.add(ring);
                mesh.userData.satRing = ring;
            }
        }

        if (isStar) {
            mesh.position.set(0, 0, 0);
            const bigRing = new THREE.RingGeometry(data.radius * 1.6, data.radius * 2.4, 96);
            const bigMat = new THREE.MeshBasicMaterial({
                color: 0xe85a8c, side: THREE.DoubleSide,
                transparent: true, opacity: 0.1, wireframe: true  // Opacity 0.15 → 0.1
            });
            const sunRing = new THREE.Mesh(bigRing, bigMat);
            sunRing.rotation.x = Math.PI / 2 + 0.15;
            mesh.add(sunRing);
            mesh.userData.sunRing = sunRing;
        } else {
            data.angle = Math.random() * Math.PI * 2;
            mesh.position.x = Math.cos(data.angle) * data.distance;
            mesh.position.z = Math.sin(data.angle) * data.distance;
        }

        scene.add(mesh);
        planetMeshes.push(mesh);

        if (!isStar) {
            const orbitGeom = new THREE.RingGeometry(data.distance - 0.04, data.distance + 0.04, 256);
            const orbitMat = new THREE.MeshBasicMaterial({
                color: data.color, side: THREE.DoubleSide,
                transparent: true, opacity: 0.08  // Giảm 0.15→0.08
            });
            const orbit = new THREE.Mesh(orbitGeom, orbitMat);
            orbit.rotation.x = Math.PI / 2;
            scene.add(orbit);
        }

        const label = document.createElement('div');
        label.className = 'planet-label' + (isStar ? ' star-label' : '');
        label.dataset.id = data.id;
        label.style.setProperty('--label-color', hexColor);
        label.style.setProperty('--label-rgb', data.rgb);
        label.innerHTML = `
            <div class="label-inner">
                <div class="label-code">${data.code} · ${data.emoji}</div>
                <div class="label-name">${data.name}</div>
            </div>
            ${isStar ? '' : '<div class="label-connector"></div>'}
        `;
        label.addEventListener('click', () => selectPlanet(mesh));
        label.addEventListener('mouseenter', () => {
            document.body.classList.add('cursor-hover');
            playSound('hover');
        });
        label.addEventListener('mouseleave', () => document.body.classList.remove('cursor-hover'));
        document.body.appendChild(label);

        const bodyObj = { mesh, data, label };

        if (!isStar) {
            const trailCount = 80;
            const trailGeom = new THREE.BufferGeometry();
            const trailPos = new Float32Array(trailCount * 3);
            const trailAlpha = new Float32Array(trailCount);
            for (let i = 0; i < trailCount; i++) {
                trailAlpha[i] = 1 - (i / trailCount);
            }
            trailGeom.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
            trailGeom.setAttribute('alpha', new THREE.BufferAttribute(trailAlpha, 1));
            const trailMat = new THREE.ShaderMaterial({
                uniforms: { uColor: { value: new THREE.Color(data.color) } },
                vertexShader: `
                    attribute float alpha;
                    varying float vAlpha;
                    void main() {
                        vAlpha = alpha;
                        vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
                        gl_Position = projectionMatrix * mvPos;
                        gl_PointSize = alpha * 4.0;
                    }
                `,
                fragmentShader: `
                    uniform vec3 uColor;
                    varying float vAlpha;
                    void main() {
                        vec2 c = gl_PointCoord - 0.5;
                        float d = length(c);
                        if (d > 0.5) discard;
                        gl_FragColor = vec4(uColor, vAlpha * (1.0 - d * 2.0) * 0.7);
                    }
                `,
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });
            const trail = new THREE.Points(trailGeom, trailMat);
            scene.add(trail);
            bodyObj.trail = trail;
            bodyObj.trailPositions = trailPos;
        }

        bodies.push(bodyObj);
    });

    // ============================================================
    // STARFIELDS
    // ============================================================
    const starLayers = [];
    function createStarfield(count, size, range, colorHex, speed) {
        const geom = new THREE.BufferGeometry();
        const pos = new Float32Array(count * 3);
        const col = new Float32Array(count * 3);
        const baseColor = new THREE.Color(colorHex);
        for (let i = 0; i < count; i++) {
            const r = range.min + Math.random() * (range.max - range.min);
            const theta = 2 * Math.PI * Math.random();
            const phi = Math.acos(2 * Math.random() - 1);
            pos[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
            pos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
            pos[i * 3 + 2] = r * Math.cos(phi);
            const v = 0.7 + Math.random() * 0.3;
            col[i * 3]     = baseColor.r * v;
            col[i * 3 + 1] = baseColor.g * v;
            col[i * 3 + 2] = baseColor.b * v;
        }
        geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        geom.setAttribute('color', new THREE.BufferAttribute(col, 3));
        const mat = new THREE.PointsMaterial({
            size, vertexColors: true, transparent: true, opacity: 0.65,  // Opacity 0.85→0.65
            blending: THREE.AdditiveBlending, sizeAttenuation: true
        });
        const points = new THREE.Points(geom, mat);
        scene.add(points);
        starLayers.push({ mesh: points, speed });
    }
    createStarfield(1200, 0.4, { min: 50, max: 140 }, 0xd070a0, 0.04);  // Pink dịu, ít hơn
    createStarfield(1800, 0.55, { min: 100, max: 250 }, 0x8acbd6, 0.02);  // Cyan pastel
    createStarfield(2200, 0.35, { min: 250, max: 500 }, 0xddddee, 0.008);  // Off-white

    // 1. Texture meteor: đá rêu phong + vết nứt phát sáng violet/emerald (không phải cam lửa)
    function createMeteorTextureV5() {
        const cvs = document.createElement('canvas');
        cvs.width = 1024; cvs.height = 512;
        const ctx = cvs.getContext('2d');

        // Nền đá xám-tím
        const bg = ctx.createRadialGradient(512, 256, 30, 512, 256, 520);
        bg.addColorStop(0, '#2a2438');
        bg.addColorStop(0.5, '#181428');
        bg.addColorStop(1, '#0a0818');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, cvs.width, cvs.height);

        // Noise đá - chấm nhỏ phủ bề mặt
        for (let i = 0; i < 5000; i++) {
            const x = Math.random() * cvs.width;
            const y = Math.random() * cvs.height;
            const sh = Math.floor(Math.random() * 50 + 30);
            ctx.fillStyle = `rgb(${sh}, ${sh}, ${Math.floor(sh * 1.15)})`;
            ctx.fillRect(x, y, Math.random() * 2.5, Math.random() * 2.5);
        }

        // Hố thiên thạch (craters)
        for (let i = 0; i < 22; i++) {
            const cx = Math.random() * cvs.width;
            const cy = Math.random() * cvs.height;
            const r = Math.random() * 55 + 18;
            const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
            cg.addColorStop(0, 'rgba(0, 0, 0, 0.65)');
            cg.addColorStop(0.65, 'rgba(30, 25, 45, 0.35)');
            cg.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = cg;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();
        }

        // Vết nứt phát sáng — pastel emerald + violet (tone observatory)
        ctx.lineCap = 'round';
        for (let i = 0; i < 16; i++) {
            const startX = Math.random() * cvs.width;
            const startY = Math.random() * cvs.height;
            const useViolet = Math.random() > 0.5;

            // Glow halo
            ctx.strokeStyle = useViolet
                ? 'rgba(176, 143, 216, 0.45)'  // violet pastel
                : 'rgba(125, 201, 165, 0.45)'; // emerald pastel
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            let x = startX, y = startY;
            const seg = Math.floor(Math.random() * 5) + 3;
            const pts = [];
            for (let s = 0; s < seg; s++) {
                x += (Math.random() - 0.5) * 75;
                y += (Math.random() - 0.5) * 55;
                pts.push([x, y]);
                ctx.lineTo(x, y);
            }
            ctx.stroke();

            // Lõi vết nứt
            ctx.strokeStyle = useViolet
                ? 'rgba(220, 200, 255, 0.95)'  // lõi violet sáng
                : 'rgba(180, 235, 210, 0.95)'; // lõi emerald sáng
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            for (const [px, py] of pts) ctx.lineTo(px, py);
            ctx.stroke();
        }

        const tex = new THREE.CanvasTexture(cvs);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.ClampToEdgeWrapping;
        return tex;
    }

    function createRuneTexture() {
        const c = document.createElement('canvas');
        c.width = 1024; c.height = 256;
        const ctx = c.getContext('2d');
        ctx.fillStyle = 'rgba(0,0,0,0)';
        ctx.fillRect(0, 0, 1024, 256);

        // Vẽ chuỗi rune lặp 8 lần (cho 8 phân khúc)

        ctx.strokeStyle = 'rgba(176, 143, 216, 0.95)';
        ctx.fillStyle = 'rgba(176, 143, 216, 0.95)';
        ctx.lineWidth = 3;
        for (let i = 0; i < symbols; i++) {
            const cx = (i + 0.5) * (1024 / symbols);
            const cy = 128;
            const sz = 28;
            ctx.save();
            ctx.translate(cx, cy);
            // Random một số loại rune đơn giản
            const t = i % 6;
            ctx.beginPath();
            if (t === 0) {
                // Tam giác
                ctx.moveTo(0, -sz); ctx.lineTo(sz, sz); ctx.lineTo(-sz, sz); ctx.closePath();
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(0, 5, 6, 0, Math.PI * 2);
                ctx.fill();
            } else if (t === 1) {
                // Vòng tròn với chấm giữa và tia
                ctx.arc(0, 0, sz, 0, Math.PI * 2); ctx.stroke();
                ctx.beginPath();
                for (let k = 0; k < 4; k++) {
                    const a = k * Math.PI / 2;
                    ctx.moveTo(Math.cos(a) * sz * 0.4, Math.sin(a) * sz * 0.4);
                    ctx.lineTo(Math.cos(a) * sz, Math.sin(a) * sz);
                }
                ctx.stroke();
            } else if (t === 2) {
                // Chữ thập + vòng tròn nhỏ giữa
                ctx.moveTo(-sz, 0); ctx.lineTo(sz, 0);
                ctx.moveTo(0, -sz); ctx.lineTo(0, sz);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(0, 0, 6, 0, Math.PI * 2);
                ctx.fill();
            } else if (t === 3) {
                // Hình thoi với chấm 4 góc
                ctx.moveTo(0, -sz); ctx.lineTo(sz, 0); ctx.lineTo(0, sz); ctx.lineTo(-sz, 0); ctx.closePath();
                ctx.stroke();
            } else if (t === 4) {
                // Mũi tên đôi
                ctx.moveTo(-sz, -sz * 0.5); ctx.lineTo(0, 0); ctx.lineTo(-sz, sz * 0.5);
                ctx.moveTo(sz, -sz * 0.5); ctx.lineTo(0, 0); ctx.lineTo(sz, sz * 0.5);
                ctx.stroke();
            } else {
                // Sigil 6 cạnh với chấm giữa
                for (let k = 0; k < 6; k++) {
                    const a = k * Math.PI / 3;
                    const x = Math.cos(a) * sz, y = Math.sin(a) * sz;
                    if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                }
                ctx.closePath(); ctx.stroke();
                ctx.beginPath();
                ctx.arc(0, 0, 4, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = THREE.RepeatWrapping;
        return tex;
    }

    function createHologramBeam(color) {
        const beamGeom = new THREE.CylinderGeometry(0.03, 0.6, 8, 12, 1, true);  // mảnh và ngắn hơn
        const beamMat = new THREE.ShaderMaterial({
            uniforms: { uColor: { value: new THREE.Color(color) }, uTime: { value: 0 } },
            vertexShader: `
                varying float vY;
                void main() {
                    vY = position.y;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 uColor;
                uniform float uTime;
                varying float vY;
                void main() {
                    float a = (vY + 4.0) / 8.0;
                    float pulse = sin(vY * 4.0 - uTime * 4.0) * 0.5 + 0.5;
                    gl_FragColor = vec4(uColor, a * 0.3 + pulse * 0.15);
                }
            `,
            transparent: true, side: THREE.DoubleSide,
            depthWrite: false, blending: THREE.AdditiveBlending
        });
        const mesh = new THREE.Mesh(beamGeom, beamMat);
        mesh.position.y = 4;
        return mesh;
    }

        return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function typewriterRender(target, fullText, speed) {
        speed = speed || 8;
        target.innerHTML = '';
        const cursor = document.createElement('span');
        cursor.className = 'typing-cursor';

        let buffer = '';
        for (let i = 0; i < fullText.length; i++) {
            buffer += fullText[i];
            target.innerHTML = marked.parse(buffer);
            target.appendChild(cursor);
            const chatBox = document.getElementById('chat-box');
            chatBox.scrollTop = chatBox.scrollHeight;
            let delay = speed;
            if (/[.!?]/.test(fullText[i])) delay = speed * 6;
            else if (/[,;:]/.test(fullText[i])) delay = speed * 3;
            else if (/\s/.test(fullText[i])) delay = speed * 0.5;
            await new Promise(r => setTimeout(r, delay));
        }
        cursor.remove();
    }

    async function callGemini(userText) {
        document.getElementById('status-ai').textContent = 'PROCESSING';
        document.getElementById('status-ai').style.color = 'var(--neon-amber)';
        consoleLog('[AI] Quantum link initiated', 'magenta');

        const target = appendAIPlaceholder();

        try {
            const payload = {
                contents: [...conversationHistory, { role: 'user', parts: [{ text: userText }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: { temperature: 0.85, maxOutputTokens: 1024 }
            };

            let response, attempts = 0;
            let delay = 800;
            while (attempts < 3) {
                try {
                    response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (response.ok) break;
                    throw new Error(`HTTP ${response.status}`);
                } catch (err) {
                    attempts++;
                    if (attempts >= 3) throw err;
                    await new Promise(r => setTimeout(r, delay));
                    delay *= 2;
                }
            }

            const result = await response.json();
            const aiText = result.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!aiText) throw new Error('Empty response from Gemini');

            conversationHistory.push({ role: 'user', parts: [{ text: userText }] });
            conversationHistory.push({ role: 'model', parts: [{ text: aiText }] });
            if (conversationHistory.length > 12) {
                conversationHistory.splice(0, 2);
            }
            saveHistory();

            await typewriterRender(target, aiText, 8);
            playSound('msg');
            document.getElementById('status-ai').textContent = 'READY';
            document.getElementById('status-ai').style.color = 'var(--text-primary)';
            consoleLog('[AI] Response synced', 'cyan');

        } catch (err) {
            console.error(err);
            target.innerHTML = `<strong style="color: var(--neon-magenta);">⚠ [QUANTUM-LINK ERROR]</strong> ${escapeHtml(err.message)}<br><span style="color: var(--text-dim); font-size: 0.85em;">Kiểm tra API key/model hoặc thử lại sau.</span>`;
            document.getElementById('status-ai').textContent = 'ERROR';
            document.getElementById('status-ai').style.color = 'var(--neon-magenta)';
            consoleLog('[AI] Link failure', 'magenta');
        }
    }

    let audioCtx = null;
    let soundEnabled = false;
    let ambientGain = null;
    let ambientOsc = null;

    function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playSound(type) {
        if (!soundEnabled || !audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        switch (type) {
            case 'hover':
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.05);
                gain.gain.setValueAtTime(0.03, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                osc.start(now); osc.stop(now + 0.1);
                break;
            case 'select':
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
                break;
            case 'launch':
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(110, now);
                osc.frequency.exponentialRampToValueAtTime(1760, now + 0.5);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                osc.start(now); osc.stop(now + 0.6);
                break;
            case 'msg':
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1320, now);
                gain.gain.setValueAtTime(0.04, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
                break;
        }
    }

    function startAmbient() {
        if (!audioCtx || ambientOsc) return;
        ambientOsc = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        ambientGain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 400;
        ambientOsc.type = 'sine';
        ambientOsc.frequency.value = 55;
        osc2.type = 'sine';
        osc2.frequency.value = 110;
        ambientOsc.connect(ambientGain);
        osc2.connect(ambientGain);
        ambientGain.connect(filter);
        filter.connect(audioCtx.destination);
        ambientGain.gain.value = 0;
        ambientGain.gain.linearRampToValueAtTime(0.04, audioCtx.currentTime + 2);
        ambientOsc.start();
        osc2.start();
        const lfo = audioCtx.createOscillator();
        const lfoGain = audioCtx.createGain();
        lfo.frequency.value = 0.1;
        lfoGain.gain.value = 5;
        lfo.connect(lfoGain);
        lfoGain.connect(ambientOsc.frequency);
        lfo.start();
    }
    function stopAmbient() {
        if (!ambientGain) return;
        ambientGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
        setTimeout(() => {
            if (ambientOsc) { ambientOsc.stop(); ambientOsc = null; }
        }, 600);
    }
